<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1117">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Skin Grinding</title>
<style>
:root {
  --bg: #090b0c;
  --bg2: #121516;
  --bg3: #1a1f20;
  --surface-raised: #202627;
  --border: #303738;
  --border-strong: #465052;
  --text: #f1f4f2;
  --text2: #9ba5a2;
  --green: #51d47b;
  --green-dim: #173d27;
  --blue: #68b8e8;
  --orange: #e6ae5c;
  --red: #f06b6b;
  --purple: #b69de8;
  --radius: 8px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; }
button { touch-action: manipulation; }

/* HEADER */
.header {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header h1 { font-size: 20px; font-weight: 700; }
.header h1 span { color: var(--green); }
.header-right { display: flex; align-items: center; gap: 12px; }
.btn-icon {
  background: none;
  border: 1px solid var(--border);
  color: var(--text2);
  width: 36px;
  height: 36px;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  transition: all .15s;
}
.btn-icon:hover { background: var(--bg3); color: var(--text); border-color: var(--text2); }

/* MAXES DISPLAY */
.maxes-bar {
  background: var(--bg3);
  border-bottom: 1px solid var(--border);
  padding: 8px 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
  font-size: 13px;
}
.max-item { display: flex; align-items: center; gap: 6px; }
.max-label { color: var(--text2); }
.max-value { color: var(--blue); font-weight: 700; }

/* NAV */
.nav {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  gap: 0;
  overflow-x: auto;
}
.nav-section {
  display: flex;
  align-items: stretch;
}
.nav-section:first-child { border-right: 1px solid var(--border); margin-right: 8px; padding-right: 8px; }
.nav-tab {
  padding: 12px 16px;
  cursor: pointer;
  color: var(--text2);
  font-size: 14px;
  font-weight: 500;
  border-bottom: 2px solid transparent;
  transition: all .15s;
  white-space: nowrap;
  user-select: none;
}
.nav-tab:hover { color: var(--text); background: var(--bg3); }
.nav-tab.active { color: var(--green); border-bottom-color: var(--green); }
.nav-tab.rest { color: var(--text2); opacity: .5; font-style: italic; }
/* "locked" = pas encore débloquée : grisée mais cliquable (révision libre) */
.nav-tab.locked { opacity: 0.5; color: var(--text2); }

/* CONTENT */
.content {
  max-width: 800px;
  margin: 0 auto;
  padding: 24px;
}
.day-header {
  margin-bottom: 24px;
}
.day-header h2 { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
.day-header p { color: var(--text2); font-size: 14px; }
.day-progress {
  margin-top: 12px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.progress-bar {
  flex: 1;
  height: 6px;
  background: var(--bg3);
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--green);
  border-radius: 3px;
  transition: width .3s ease;
}
.progress-text { font-size: 13px; color: var(--text2); min-width: 40px; }

/* REST DAY */
.rest-day {
  text-align: center;
  padding: 80px 24px;
}
.rest-day .icon { font-size: 64px; margin-bottom: 16px; }
.rest-day h2 { font-size: 28px; margin-bottom: 8px; }
.rest-day p { color: var(--text2); font-size: 16px; }

/* EXERCISE CARD */
.exercise-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 16px;
  overflow: hidden;
  transition: border-color .15s;
}
.exercise-card.completed { border-color: var(--green-dim); }
.exercise-header {
  display: flex;
  align-items: center;
  padding: 14px 16px;
  gap: 12px;
  cursor: pointer;
  user-select: none;
}
.exercise-tag {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--green);
  color: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 14px;
  flex-shrink: 0;
}
.exercise-name { font-weight: 600; font-size: 16px; flex: 1; }
.exercise-check {
  color: var(--text2);
  font-size: 18px;
}
.exercise-card.completed .exercise-check { color: var(--green); }

/* SET ROWS */
.sets-container { padding: 0 16px 12px; }
.set-row {
  display: flex;
  align-items: center;
  padding: 8px 0;
  gap: 12px;
  border-top: 1px solid var(--border);
  transition: opacity .15s;
}
.set-row.done { opacity: .5; }
.set-checkbox {
  width: 22px;
  height: 22px;
  border: 2px solid var(--border);
  border-radius: 4px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all .15s;
  color: transparent;
  font-size: 14px;
}
.set-checkbox:hover { border-color: var(--green); }
.set-checkbox.checked {
  background: var(--green);
  border-color: var(--green);
  color: #000;
}
.set-info { flex: 1; font-size: 14px; }
.set-info .reps { font-weight: 600; }
.set-info .weight { color: var(--blue); margin-left: 6px; font-weight: 600; }
.set-info .pct { color: var(--text2); margin-left: 4px; font-size: 12px; }
.set-info .rpe { color: var(--orange); margin-left: 8px; font-size: 12px; font-weight: 600; }
.set-info .amrap-badge {
  background: var(--red);
  color: #fff;
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 700;
  margin-left: 6px;
}
.acc-input {
  width: 48px;
  padding: 4px 5px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 5px;
  font-size: 13px;
  font-weight: 600;
  text-align: center;
  font-family: inherit;
  -moz-appearance: textfield;
}
.acc-input::-webkit-outer-spin-button,
.acc-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.acc-input:focus { outline: none; }
.acc-input.empty { border-style: dashed; }
.acc-input.reps-input { color: var(--green); width: 42px; }
.acc-input.reps-input:focus { border-color: var(--green); }
.acc-input.reps-input.empty { color: var(--text2); }
.acc-input.weight-input { color: var(--blue); width: 52px; }
.acc-input.weight-input:focus { border-color: var(--blue); }
.acc-input.weight-input.empty { color: var(--text2); }
.acc-unit { color: var(--text2); font-size: 11px; margin-left: 1px; margin-right: 6px; }
.acc-x { color: var(--text2); font-size: 12px; margin: 0 4px; }
.acc-range {
  margin-left: auto;
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--bg3);
  border: 1px solid var(--border);
  font-size: 11px;
  font-weight: 600;
  color: var(--text2);
  white-space: nowrap;
  flex-shrink: 0;
}

/* ACCESSORY RUNNING TOTAL */
.acc-total {
  border-top: 1px solid var(--border);
  margin-top: 4px;
  padding: 8px 0 2px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.acc-total-count { font-size: 14px; font-weight: 700; color: var(--text2); }
.acc-total-cond { font-size: 11px; color: var(--text2); }
.acc-total.met .acc-total-count { color: var(--green); }
.acc-total.met .acc-total-cond { color: var(--green); opacity: .85; }

/* ACCESSORY NOTE (free text, above the sets) */
.acc-note-row { padding: 10px 0 4px; }
.acc-note-input {
  width: 100%;
  padding: 6px 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
}
.acc-note-input::placeholder { color: var(--text2); }
.acc-note-input:focus { outline: none; border-color: var(--blue); }
.acc-note-input.empty { border-style: dashed; }

/* TEMPORARY ACCESSORIES */
.exercise-card.extra-accessory { border-color: var(--blue); }
.exercise-card.extra-accessory .exercise-tag { background: var(--blue); }
.remove-extra-btn {
  width: 30px;
  height: 30px;
  border: 0;
  background: transparent;
  color: var(--text2);
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
}
.remove-extra-btn:hover { color: var(--red); }
.add-accessory-btn {
  width: 100%;
  min-height: 46px;
  margin: 4px 0 16px;
  border: 1px dashed var(--blue);
  border-radius: 8px;
  background: transparent;
  color: var(--blue);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}
.add-accessory-btn:hover { background: var(--bg2); }
.accessory-picker-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: min(58vh, 520px);
  overflow-y: auto;
  margin-top: 14px;
}
.accessory-picker-item {
  width: 100%;
  padding: 11px 12px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--bg3);
  color: var(--text);
  text-align: left;
  cursor: pointer;
}
.accessory-picker-item:hover { border-color: var(--blue); }
.accessory-picker-item:disabled { opacity: .45; cursor: default; }
.accessory-picker-name { display: block; font-size: 14px; font-weight: 600; }
.accessory-picker-meta { display: block; margin-top: 3px; color: var(--text2); font-size: 12px; }

/* ACCOUNT */
.account-separator {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 14px 0;
  color: var(--text2);
  font-size: 12px;
}
.account-separator::before, .account-separator::after {
  content: "";
  height: 1px;
  flex: 1;
  background: var(--border);
}
.login-box button.account-login-btn {
  background: var(--bg3);
  border: 1px solid var(--blue);
  color: var(--blue);
}
.account-fields { display: grid; gap: 10px; margin-top: 16px; }
.account-fields label { color: var(--text2); font-size: 12px; }
.account-fields input {
  width: 100%;
  margin-top: 4px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  color: var(--text);
  font: inherit;
}
.account-fields input:focus { outline: none; border-color: var(--blue); }
.account-message { min-height: 18px; margin-top: 10px; color: var(--text2); font-size: 12px; }
.account-message.error { color: var(--red); }
.account-message.success { color: var(--green); }
.account-link-btn {
  border: 0;
  background: transparent;
  color: var(--blue);
  cursor: pointer;
  font: inherit;
  font-size: 12px;
}
.account-status { color: var(--green); font-size: 12px; }

/* SESSION VALIDATION FOOTER */
.session-validate {
  margin-top: 24px;
  padding: 16px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  flex-wrap: wrap;
}
.btn-valider {
  padding: 12px 28px;
  background: var(--green-dim);
  border: 1px solid var(--green);
  color: var(--green);
  border-radius: 8px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: all .15s;
}
.btn-valider:hover { background: var(--green); color: #000; }
.session-validate-ok { color: var(--green); font-weight: 600; font-size: 14px; }
.btn-devalider {
  padding: 8px 16px;
  background: #5c1a1a;
  border: 1px solid var(--red);
  color: var(--red);
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
}
.btn-devalider:hover { background: var(--red); color: #fff; }

/* TIMER */
.timer-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg2);
  border-top: 1px solid var(--border);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  z-index: 100;
}
.timer-display {
  font-size: 32px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  min-width: 100px;
  text-align: center;
}
.timer-display.warning { color: var(--orange); }
.timer-display.done { color: var(--green); }
.timer-btn {
  padding: 8px 20px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg3);
  color: var(--text);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
}
.timer-btn:hover { background: var(--border); }
.timer-btn.primary { background: var(--green-dim); border-color: var(--green); color: var(--green); }
.timer-btn.primary:hover { background: var(--green); color: #000; }
/* SETTINGS MODAL */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.7);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  width: 400px;
  max-width: 90vw;
}
.modal h3 { margin-bottom: 16px; font-size: 18px; }
.modal label { display: block; color: var(--text2); font-size: 13px; margin-bottom: 6px; margin-top: 14px; }
.modal input[type="date"], .modal input[type="number"] {
  width: 100%;
  padding: 8px 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 14px;
}
.modal-actions { display: flex; gap: 8px; margin-top: 20px; justify-content: flex-end; flex-wrap: wrap; }
.modal-actions button {
  padding: 8px 16px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg3);
  color: var(--text);
  cursor: pointer;
  font-size: 14px;
}
.modal-actions .save { background: var(--green-dim); border-color: var(--green); color: var(--green); }
.modal-actions .danger { background: #5c1a1a; border-color: var(--red); color: var(--red); }
.settings-actions { display: grid; gap: 8px; width: 100%; }
.settings-actions-main {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}
.settings-actions-main button { min-width: 0; }
.settings-actions-footer { display: flex; justify-content: flex-end; gap: 8px; }
.max-settings-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin-top: 4px;
}
.max-settings-grid small { display: block; margin-top: 5px; color: var(--text2); }

/* SCROLLBAR */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text2); }

/* Extra bottom padding for timer */
.content { padding-bottom: 180px; }

/* PAGE TOGGLE */
.page-toggle {
  display: flex;
  gap: 0;
  background: var(--bg3);
  border-radius: 8px;
  padding: 2px;
  margin-left: 12px;
}
.page-toggle button {
  padding: 6px 14px;
  border: none;
  background: none;
  color: var(--text2);
  font-size: 13px;
  font-weight: 600;
  border-radius: 6px;
  cursor: pointer;
  transition: all .15s;
}
.page-toggle button.active { background: var(--green-dim); color: var(--green); }
.page-toggle button:hover:not(.active) { color: var(--text); }

/* HISTORY PAGE */
.history-container { max-width: 900px; margin: 0 auto; padding: 24px; padding-bottom: 180px; }
.history-container h2 { font-size: 22px; margin-bottom: 20px; }

.history-filters {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.history-filters select, .history-filters input {
  padding: 6px 12px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 13px;
}

.maxes-history {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 24px;
}
.maxes-history h3 { font-size: 15px; margin-bottom: 12px; color: var(--text2); }
.maxes-chart {
  display: flex;
  gap: 24px;
}
.max-chart-item { flex: 1; }
.max-chart-label { font-size: 12px; color: var(--text2); margin-bottom: 4px; }
.max-chart-value { font-size: 22px; font-weight: 700; color: var(--blue); }
.max-chart-delta { font-size: 12px; margin-left: 6px; }
.max-chart-delta.up { color: var(--green); }
.max-chart-delta.down { color: var(--red); }
.max-chart-delta.same { color: var(--text2); }

.max-timeline {
  margin-top: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.max-timeline-row {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
}
.max-timeline-row:last-child { border-bottom: none; }
.max-timeline-date { color: var(--text2); min-width: 90px; }
.max-timeline-values { display: flex; gap: 16px; }
.max-timeline-val { font-weight: 600; }
.max-timeline-val.squat { color: var(--green); }
.max-timeline-val.bench { color: var(--blue); }
.max-timeline-val.dl { color: var(--orange); }

.session-log {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 12px;
  overflow: hidden;
}
.session-header {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  gap: 12px;
  cursor: pointer;
  user-select: none;
}
.session-header:hover { background: var(--bg3); }
.session-date { font-weight: 600; min-width: 100px; }
.session-label { flex: 1; color: var(--text2); font-size: 14px; }
.session-badge {
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 700;
}
.session-badge.complete { background: var(--green-dim); color: var(--green); }
.session-badge.partial { background: #3d2e00; color: var(--orange); }
.session-detail {
  padding: 0 16px 12px;
  display: none;
  border-top: 1px solid var(--border);
}
.session-detail.open { display: block; padding-top: 12px; }
.session-exercise { margin-bottom: 8px; }
.session-exercise-name { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
.session-sets { font-size: 12px; color: var(--text2); }
.session-date {
  min-width: 78px;
  color: var(--text);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}

.empty-history {
  text-align: center;
  padding: 60px 24px;
  color: var(--text2);
}
.empty-history .icon { font-size: 48px; margin-bottom: 12px; }

/* Graph bars */
.graph-container {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 24px;
}
.graph-container h3 { font-size: 15px; margin-bottom: 16px; color: var(--text2); }
.graph-bars {
  display: flex;
  align-items: flex-end;
  gap: 4px;
  height: 120px;
  padding-top: 8px;
}
.graph-bar-group {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100%;
  justify-content: flex-end;
}
.graph-bar {
  width: 100%;
  max-width: 30px;
  border-radius: 3px 3px 0 0;
  min-height: 2px;
  transition: height .3s;
}
.graph-bar.squat { background: var(--green); }
.graph-bar.bench { background: var(--blue); }
.graph-bar.dl { background: var(--orange); }
.graph-bar-label {
  font-size: 10px;
  color: var(--text2);
  margin-top: 4px;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 50px;
}
.graph-legend {
  display: flex;
  gap: 16px;
  margin-top: 12px;
  justify-content: center;
}
.graph-legend-item {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;

<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-database-compat.js"></script>
<script>
// ============================================================
// PERSONAL ACCOUNT + MULTI-DEVICE SYNC
// ============================================================
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAa_mArHrX4Qs9rtX7pWHh_Ctyp-8qIQ38",
  authDomain: "skin-grinding.firebaseapp.com",
  databaseURL: "https://skin-grinding-default-rtdb.firebaseio.com",
  projectId: "skin-grinding",
  storageBucket: "skin-grinding.firebasestorage.app",
  messagingSenderId: "94530619554",
  appId: "1:94530619554:web:4d54f18fa30a1f7f442ffb"
};

let accountAuth = null;
let accountDatabase = null;
let accountUser = null;
let accountApplyingRemote = false;
let accountProgramTimer = null;
let accountListeners = [];

function accountSessionKey(session) {
  return `${session.date}_c${session.cycle || 1}_w${session.week}_s${session.day}`;
}

function historyToCloudMap(history) {
  const sessions = {};
  const maxHistory = {};
  (history.sessions || []).forEach(session => {
    sessions[accountSessionKey(session)] = session;
  });
  (history.maxHistory || []).forEach(entry => {
    if (entry?.date) maxHistory[entry.date] = entry;
  });
  return { sessions, maxHistory };
}

function cloudMapToHistory(data) {
  return {
    sessions: Object.values(data?.sessions || {}),
    maxHistory: Object.values(data?.maxHistory || {})
  };
}

function getLocalProgramData() {
  try {
    return JSON.parse(localStorage.getItem("muscu_program")) || null;
  } catch(e) {
    return null;
  }
}

function setAccountMessage(message, type = "") {
  const el = document.getElementById("accountMessage");
  if (!el) return;
  el.textContent = message;
  el.className = `account-message${type ? " " + type : ""}`;
}

function setWelcomeMessage(message, type = "") {
  const el = document.getElementById("welcomeMessage");
  el.textContent = message;
  el.className = `login-error${type ? " " + type : ""}`;
}

function accountErrorMessage(error) {
  const code = error?.code || "";
  if (code.includes("invalid-credential")) return "E-mail ou mot de passe incorrect.";
  if (code.includes("email-already-in-use")) return "Un compte existe déjà avec cet e-mail.";
  if (code.includes("weak-password")) return "Le mot de passe doit contenir au moins 6 caractères.";
  if (code.includes("invalid-email")) return "Adresse e-mail invalide.";
  if (code.includes("wrong-password")) return "Le mot de passe actuel est incorrect.";
  if (code.includes("requires-recent-login")) return "Reconnecte-toi avant de modifier le mot de passe.";
  if (code.includes("too-many-requests")) return "Trop de tentatives. Réessaie plus tard.";
  if (code.includes("network-request-failed")) return "Connexion réseau indisponible.";
  return "Une erreur est survenue. Réessaie.";
}

function updateAccountModal() {
  const connected = !!accountUser;
  document.getElementById("accountStatus").textContent =
    connected ? `Connecté : ${accountUser.email}` : "";
  document.getElementById("accountChangeFields").style.display = connected ? "grid" : "none";
  document.getElementById("accountLogoutBtn").style.display = connected ? "" : "none";
  document.getElementById("accountChangePasswordBtn").style.display = connected ? "" : "none";
  if (connected) setAccountMessage("Synchronisation active.", "success");
}

function openAccountModal() {
  if (!accountUser) {
    closeSettings();
    document.getElementById("loginOverlay").style.display = "flex";
    return;
  }
  updateAccountModal();
  document.getElementById("accountModal").classList.add("show");
}

function closeAccountModal() {
  document.getElementById("accountModal").classList.remove("show");
  setAccountMessage("");
  ["accountCurrentPassword", "accountNewPassword", "accountNewPasswordConfirm"].forEach(id => {
    document.getElementById(id).value = "";
  });
}

async function loginFromWelcome() {
  const email = document.getElementById("welcomeEmail").value.trim();
  const password = document.getElementById("welcomePassword").value;
  if (!email || !password) {
    setWelcomeMessage("Saisis ton e-mail et ton mot de passe.");
    return;
  }
  setWelcomeMessage("Connexion...");
  try {
    await accountAuth.signInWithEmailAndPassword(email, password);
  } catch(error) {
    setWelcomeMessage(accountErrorMessage(error));
  }
}

async function registerFromWelcome() {
  const email = document.getElementById("welcomeEmail").value.trim();
  const password = document.getElementById("welcomePassword").value;
  if (!email || !password) {
    setWelcomeMessage("Saisis un e-mail et un mot de passe.");
    return;
  }
  setWelcomeMessage("Création du compte...");
  try {
    await accountAuth.createUserWithEmailAndPassword(email, password);
  } catch(error) {
    setWelcomeMessage(accountErrorMessage(error));
  }
}

async function resetPasswordFromWelcome() {
  const email = document.getElementById("welcomeEmail").value.trim();
  if (!email) {
    setWelcomeMessage("Saisis d'abord ton adresse e-mail.");
    return;
  }
  try {
    await accountAuth.sendPasswordResetEmail(email);
    setWelcomeMessage("E-mail de réinitialisation envoyé.", "success");
  } catch(error) {
    setWelcomeMessage(accountErrorMessage(error));
  }
}

async function logoutAccount() {
  closeAccountModal();
  await accountAuth.signOut();
}

async function changeAccountPassword() {
  if (!accountUser?.email) {
    setAccountMessage("Aucun compte connecté.", "error");
    return;
  }
  const currentPassword = document.getElementById("accountCurrentPassword").value;
  const newPassword = document.getElementById("accountNewPassword").value;
  const confirmation = document.getElementById("accountNewPasswordConfirm").value;
  if (!currentPassword || !newPassword || !confirmation) {
    setAccountMessage("Remplis les trois champs.", "error");
    return;
  }
  if (newPassword.length < 6) {
    setAccountMessage("Le nouveau mot de passe doit contenir au moins 6 caractères.", "error");
    return;
  }
  if (newPassword !== confirmation) {
    setAccountMessage("Les nouveaux mots de passe ne correspondent pas.", "error");
    return;
  }

  setAccountMessage("Modification du mot de passe...");
  try {
    const credential = firebase.auth.EmailAuthProvider.credential(accountUser.email, currentPassword);
    await accountUser.reauthenticateWithCredential(credential);
    await accountUser.updatePassword(newPassword);
    ["accountCurrentPassword", "accountNewPassword", "accountNewPasswordConfirm"].forEach(id => {
      document.getElementById(id).value = "";
    });
    setAccountMessage("Mot de passe modifié.", "success");
  } catch(error) {
    setAccountMessage(accountErrorMessage(error), "error");
  }
}

function applyCloudProgram(program) {
  if (!program || typeof program !== "object") return;
  const requiresMigration = program.programVersion !== PROGRAM_VERSION;
  accountApplyingRemote = true;
  localStorage.setItem("muscu_program", JSON.stringify(program));
  loadState();
  accountApplyingRemote = false;
  if (requiresMigration) scheduleAccountProgramSync(getLocalProgramData());
  render();
}

function applyCloudHistory(remoteHistory) {
  const merged = mergeHistory(loadHistory(), remoteHistory);
  localStorage.setItem("muscu_history", JSON.stringify(merged));
  if (currentPage === "history") renderHistory();
}

async function migrateLocalDataToAccount(user) {
  const localProgram = getLocalProgramData() || {};
  const localHistory = loadHistory();
  const cloudHistory = historyToCloudMap(localHistory);
  const accountRef = accountDatabase.ref(`accounts/${user.uid}`);
  await accountRef.set({
    profile: {
      email: user.email,
      createdAt: firebase.database.ServerValue.TIMESTAMP
    },
    program: { ...localProgram, updatedAt: Date.now() },
    sessions: cloudHistory.sessions,
    maxHistory: cloudHistory.maxHistory,
    meta: {
      schemaVersion: 1,
      migratedAt: firebase.database.ServerValue.TIMESTAMP
    }
  });
}

async function initializeAccountData(user) {
  const accountRef = accountDatabase.ref(`accounts/${user.uid}`);
  const snapshot = await accountRef.once("value");
  const cloud = snapshot.val();

  if (!cloud?.meta?.migratedAt) {
    await migrateLocalDataToAccount(user);
  } else {
    const localProgram = getLocalProgramData();
    const remoteProgram = cloud.program || null;
    if (remoteProgram && (!localProgram || (remoteProgram.updatedAt || 0) > (localProgram.updatedAt || 0))) {
      applyCloudProgram(remoteProgram);
    } else if (localProgram) {
      await accountRef.child("program").set(localProgram);
    }
    const mergedHistory = mergeHistory(loadHistory(), cloudMapToHistory(cloud));
    localStorage.setItem("muscu_history", JSON.stringify(mergedHistory));
    await syncAccountHistory(mergedHistory);
  }

  accountListeners.forEach(ref => ref.off());
  accountListeners = [];

  const programRef = accountRef.child("program");
  programRef.on("value", snap => {
    const remote = snap.val();
    const local = getLocalProgramData();
    if (remote && (remote.updatedAt || 0) > (local?.updatedAt || 0)) {
      applyCloudProgram(remote);
    }
  });
  accountListeners.push(programRef);

  const historyRef = accountRef;
  historyRef.on("value", snap => {
    const data = snap.val();
    if (data) applyCloudHistory(cloudMapToHistory(data));
  });
  accountListeners.push(historyRef);
}

function scheduleAccountProgramSync(data) {
  if (!accountUser || !accountDatabase || accountApplyingRemote) return;
  clearTimeout(accountProgramTimer);
  accountProgramTimer = setTimeout(() => {
    accountDatabase.ref(`accounts/${accountUser.uid}/program`).set(data);
  }, 400);
}

async function syncAccountHistory(history) {
  if (!accountUser || !accountDatabase) return;
  const maps = historyToCloudMap(history);
  const updates = {};
  Object.entries(maps.sessions).forEach(([key, value]) => {
    updates[`sessions/${key}`] = value;
  });
  Object.entries(maps.maxHistory).forEach(([key, value]) => {
    updates[`maxHistory/${key}`] = value;
  });
  updates["profile/lastSyncAt"] = firebase.database.ServerValue.TIMESTAMP;
  await accountDatabase.ref(`accounts/${accountUser.uid}`).update(updates);
}

function deleteAccountSession(session) {
  if (!accountUser || !accountDatabase || !session) return;
  accountDatabase.ref(`accounts/${accountUser.uid}/sessions/${accountSessionKey(session)}`).remove();
}

function clearAccountHistory() {
  if (!accountUser || !accountDatabase) return;
  accountDatabase.ref(`accounts/${accountUser.uid}`).update({
    sessions: null,
    maxHistory: null
  });
}

function initAccountSystem() {
  if (!window.firebase) {
    setWelcomeMessage("Service de connexion indisponible. Vérifie ta connexion.");
    return;
  }
  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  accountAuth = firebase.auth();
  accountDatabase = firebase.database();
  accountAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
  accountAuth.onAuthStateChanged(async user => {
    accountListeners.forEach(ref => ref.off());
    accountListeners = [];
    accountUser = user;
    updateAccountModal();
    if (!user) {
      document.getElementById("loginOverlay").style.display = "flex";
      return;
    }
    document.getElementById("loginOverlay").style.display = "none";
    document.getElementById("welcomePassword").value = "";
    setWelcomeMessage("");
    setAccountMessage("Synchronisation...", "");
    try {
      await initializeAccountData(user);
      setAccountMessage("Synchronisation active.", "success");
    } catch(error) {
      setAccountMessage("Synchronisation impossible. Les données locales sont conservées.", "error");
    }
  });
}

// ============================================================
// STRUCTURE TRANSFORM — regroupe les 4 blocs × 7 jours (avec repos)
// en 4 Waves × 10 Sessions (file linéaire, sans jour de repos).
// Les données (sets/reps/pct/rpe) sont réutilisées telles quelles :
// on ne fait que redécouper et re-tagger. Rien n'est recalculé.
// ============================================================
function buildWaves(raw) {
  const LETTERS = ['A','B','C','D','E','F','G'];
  // Accessoires (sans ref) : on n'affiche pas de cible RPE -> on la retire.
  // Les exos de force (avec ref/pct) conservent leur RPE.
  const stripRpe = (ex) => ex.ref ? ex
    : { ...ex, sets: ex.sets.map(({ rpe, ...rest }) => rest) };
  const retag = (list) => list.map((ex, i) => ({ ...stripRpe(ex), tag: LETTERS[i] || '' }));
  return raw.map((bloc, wi) => {
    // On retire les jours de repos, puis on reprend l'ordre :
    // Day1, Day2, Day3, Day4, Day6, Day7 (l'ancien Day5 = repos, supprimé).
    const [day1, day2, day3, day4, day6, day7] = bloc.days.filter(d => !d.rest);
    const sessions = [
      { name: day1.name,      exercises: retag(day1.exercises) },              // S1
      { name: day2.name,      exercises: retag(day2.exercises.slice(0, 3)) },  // S2
      { name: 'Dos',          exercises: retag(day2.exercises.slice(3)) },     // S3
      { name: day3.name,      exercises: retag(day3.exercises.slice(0, 3)) },  // S4
      { name: 'Bras + Abdos', exercises: retag(day3.exercises.slice(3)) },     // S5
      { name: day4.name,      exercises: retag(day4.exercises) },              // S6
      { name: day6.name,      exercises: retag(day6.exercises.slice(0, 4)) },  // S7
      { name: 'Jambes',       exercises: retag(day6.exercises.slice(4)) },     // S8
      { name: day7.name,      exercises: retag(day7.exercises.slice(0, 3)) },  // S9
      { name: 'Dos + Bras',   exercises: retag(day7.exercises.slice(3)) }      // S10
    ];
    return { name: `Wave ${wi + 1}`, days: sessions };
  });
}

function getMax(ref) {
  if (ref === "squat") return state.maxSquat;
  if (ref === "bench") return state.maxBench;
  if (ref === "deadlift") return state.maxDeadlift;
  return null;
}

function calcWeight(pct, ref) {
  const max = getMax(ref);
  if (!max || !pct) return null;
  return Math.round((max * pct / 100) / 2.5) * 2.5;
}

function buildAccessoryCatalog() {
  const byId = new Map();
  PROGRAM.forEach(wave => wave.days.forEach(day => {
    (day.exercises || []).forEach(ex => {
      if (ex.ref) return;
      const id = ex.id || ACCESSORY_IDS[ex.name];
      if (!id) return;
      const candidate = {
        id,
        name: ex.name,
        range: ex.range || ACC_RANGES[ex.name] || "6-10",
        sets: ex.sets.map(group => ({ ...group }))
      };
      const current = byId.get(id);
      if (!current || expandSets(candidate).length > expandSets(current).length) {
        byId.set(id, candidate);
      }
    });
  }));
  return Array.from(byId.values()).sort((a, b) => a.name.localeCompare(b.name, "fr"));
}

function normalizeAccessoryId(id) {
  return ACCESSORY_ID_ALIASES[id] || id;
}

function equivalentAccessoryIds(id) {
  const canonical = normalizeAccessoryId(id);
  return [canonical, ...Object.keys(ACCESSORY_ID_ALIASES)
    .filter(alias => ACCESSORY_ID_ALIASES[alias] === canonical)];

// ============================================================
// HELPERS
// ============================================================
function expandSets(exercise) {
  const expanded = [];
  exercise.sets.forEach((group, gi) => {
    for (let i = 0; i < group.s; i++) {
      expanded.push({ ...group, groupIndex: gi, setIndex: i, ref: exercise.ref });
    }
  });
  return expanded;
}

function getExerciseSets(exercise) {
  const sets = expandSets(exercise);
  if (!exercise.preFatigue) return sets;
  const selected = state.preFatigueSets[exercise.id] || 1;
  return sets.slice(0, selected);
}

function setPreFatigueSetCount(exerciseId, count) {
  state.preFatigueSets[exerciseId] = count === 2 ? 2 : 1;
  if (count === 1) {
    PROGRAM[0].days.forEach((day, dayIndex) => {
      const exerciseIndex = (day.exercises || []).findIndex(ex => ex.id === exerciseId);
      if (exerciseIndex >= 0) {
        delete state.completions[setKey(0, dayIndex, String(exerciseIndex), 1)];
      }
    });
  }
  saveState();
  render();
}

function sessionOccurrenceKey(cycle = state.cycle, week = state.week, day = state.day) {
  return `c${cycle}w${week}s${day}`;
}

function getExtraAccessoryIds(week = state.week, day = state.day) {
  return (state.extraAccessories[sessionOccurrenceKey(state.cycle, week, day)] || [])
    .map(normalizeAccessoryId);
}

function getSessionExercises(week = state.week, day = state.day) {
  const base = PROGRAM[week].days[day].exercises || [];
  const occurrence = sessionOccurrenceKey(state.cycle, week, day);
  const freestyleSelection = state.freestyleSelections[occurrence];
  const freestyleTemplate = freestyleSelection ? FREESTYLE_BY_ID[freestyleSelection.id] : null;
  const freestyle = freestyleTemplate ? [{
    ...freestyleTemplate,
    sets: [{ ...freestyleTemplate.sets[0], s: freestyleSelection.sets || 3 }]
  }] : [];
  const extras = getExtraAccessoryIds(week, day)
    .map(id => ACCESSORY_BY_ID[id])
    .filter(Boolean)
    .map(ex => ({
      ...ex,
      sets: ex.sets.map(group => ({ ...group })),
      isExtra: true
    }));
  return [...base, ...freestyle, ...extras];
}

function exerciseCompletionKey(exercise, exIdx) {
  if (exercise.isFreestyle) return `f-${exercise.id}`;
  return exercise.isExtra ? `x-${exercise.id}` : String(exIdx);
}

function setKey(week, day, exKey, setIdx) {
  return `w${week}d${day}e${exKey}s${setIdx}`;
}

function localDateKey(date = new Date()) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function isSetDone(week, day, exKey, setIdx) {
  return !!state.completions[setKey(week, day, exKey, setIdx)];
}

function getExerciseTimerDuration(week, day, exKey) {
  const exercise = getSessionExercises(week, day).find((candidate, index) =>
    exerciseCompletionKey(candidate, index) === String(exKey)
  );
  if (!exercise || exercise.preFatigue) return 0;
  return exercise.rest || 120;
}

function toggleSetDone(week, day, exKey, setIdx) {
  const wasComplete = getDayProgress(week, day).pct === 100;
  const key = setKey(week, day, exKey, setIdx);
  const wasChecked = !!state.completions[key];
  if (wasChecked) {
    delete state.completions[key];
  } else {
    state.completions[key] = true;
    const duration = getExerciseTimerDuration(week, day, exKey);
    if (duration > 0) startRestTimer(duration);
  }
  saveState();
  render();
  afterSessionChange(week, day, wasComplete);
}

function getDayProgress(week, day) {
  const dayData = PROGRAM[week].days[day];
  if (dayData.rest) return { done: 0, total: 0, pct: 100 };
  let total = 0, done = 0;
  getSessionExercises(week, day).forEach((ex, ei) => {
    const exKey = exerciseCompletionKey(ex, ei);
    const sets = getExerciseSets(ex);
    total += sets.length;
    sets.forEach((_, si) => {
      if (isSetDone(week, day, exKey, si)) done++;
    });
  });
  if (dayData.freestyle && !state.freestyleSelections[sessionOccurrenceKey(state.cycle, week, day)]) {
    total += 1;
  }
  return { done, total, pct: total > 0 ? Math.round((done/total)*100) : 0 };
}

function isBlocComplete(blocIndex) {
  const bloc = PROGRAM[blocIndex];
  for (let di = 0; di < bloc.days.length; di++) {
    if (bloc.days[di].rest) continue;
    if (getDayProgress(blocIndex, di).pct < 100) return false;
  }
  return true;
}

function isBlocUnlocked(blocIndex) {
  if (blocIndex === 0) return true;
  return isBlocComplete(blocIndex - 1);
}

function getLatestExercisePerformance(exerciseName) {
  const exerciseId = ACCESSORY_IDS[exerciseName];
  const validIds = equivalentAccessoryIds(exerciseId);
  const sessions = loadHistory().sessions || [];
  for (let i = sessions.length - 1; i >= 0; i--) {
    const exercise = (sessions[i].exercises || []).find(ex =>
      (exerciseId && validIds.includes(ex.id)) || ex.name === exerciseName);
    if (!exercise) continue;
    const completed = (exercise.sets || []).filter(set => set.done);
    if (!completed.length) continue;
    const reps = completed.map(set => set.reps === "AMRAP" ? "MAX" : set.reps).join(" / ");
    const weights = [...new Set(completed.map(set => set.weight).filter(weight => weight !== null && weight !== undefined))];
    const weightText = weights.length ? `${weights.join(" / ")} kg · ` : "";
    return `${weightText}${reps} reps · ${sessions[i].date}`;
  }
  return "Aucune performance enregistrée";
}

  document.getElementById("accessoryPickerTitle").textContent = "Exercice libre jambes";
  document.getElementById("accessoryPickerSubtitle").textContent = "Choisis selon tes envies et tes besoins du jour.";
  document.getElementById("accessoryPickerList").innerHTML = FREESTYLE_CATALOG.map(ex => {
    const summary = getLatestExercisePerformance(ex.name);
    return `<button class="accessory-picker-item" onclick="selectFreestyleExercise('${ex.id}')">`
      + `<span class="accessory-picker-name">${ex.name}</span>`
      + `<span class="accessory-picker-meta">${summary}</span>`
      + `</button>`;
  }).join("");
  document.getElementById("accessoryPickerModal").classList.add("show");
}

function selectFreestyleExercise(exerciseId) {
  if (!FREESTYLE_BY_ID[exerciseId]) return;
  state.freestyleSelections[sessionOccurrenceKey()] = { id: exerciseId, sets: 3 };
  saveState();
  closeAccessoryPicker();
  render();
}

function changeFreestyleSetCount(delta) {
  const occurrence = sessionOccurrenceKey();
  const selection = state.freestyleSelections[occurrence];
  if (!selection) return;
  const previous = selection.sets || 3;
  const next = Math.max(1, Math.min(8, previous + delta));
  selection.sets = next;
  if (next < previous) {
    for (let index = next; index < previous; index++) {
      delete state.completions[setKey(state.week, state.day, `f-${selection.id}`, index)];
    }
  }
  saveState();
  render();
}

function removeFreestyleExercise() {
  const occurrence = sessionOccurrenceKey();
  const selection = state.freestyleSelections[occurrence];
  if (!selection) return;
  const count = selection.sets || 3;
  const hasCompletedSet = Array.from({ length: count }, (_, index) => index)
    .some(index => isSetDone(state.week, state.day, `f-${selection.id}`, index));
  if (hasCompletedSet && !confirm("Retirer cet exercice libre et ses séries de la séance ?")) return;
  for (let index = 0; index < count; index++) {
    delete state.completions[setKey(state.week, state.day, `f-${selection.id}`, index)];
  }
  delete state.freestyleSelections[occurrence];
  saveState();
  render();
}

function closeAccessoryPicker() {
  document.getElementById("accessoryPickerModal").classList.remove("show");
}

function addExtraAccessory(accessoryId) {
  if (!ACCESSORY_BY_ID[accessoryId]) return;
  const key = sessionOccurrenceKey();
  const ids = state.extraAccessories[key] || [];
  if (!ids.includes(accessoryId)) ids.push(accessoryId);
  state.extraAccessories[key] = ids;
  saveState();
  closeAccessoryPicker();
  render();
}

function removeExtraAccessory(accessoryId) {
  const exercise = ACCESSORY_BY_ID[accessoryId];
  if (!exercise) return;
  const today = localDateKey();
  const loggedSession = loadHistory().sessions.find(session =>
    session.date === today && session.week === state.week && session.day === state.day
      && session.cycle === state.cycle);
  const isSavedInHistory = (loggedSession?.exercises || []).some(ex =>
    ex.source === "added" && (ex.id === accessoryId || ex.name === exercise.name));
  if (isSavedInHistory) {
    alert("Cette séance est déjà enregistrée. Dévalide-la avant de retirer un accessoire.");
    return;
  }
  const exKey = `x-${accessoryId}`;
  const hasCompletedSet = expandSets(exercise).some((_, si) =>
    isSetDone(state.week, state.day, exKey, si));
  if (hasCompletedSet && !confirm(`Retirer ${exercise.name} de cette séance ? Ses séries non validées ne seront pas enregistrées dans l'historique.`)) {
    return;
  }
  const occurrence = sessionOccurrenceKey();
  state.extraAccessories[occurrence] = (state.extraAccessories[occurrence] || [])
    .filter(id => id !== accessoryId);
  if (!state.extraAccessories[occurrence].length) delete state.extraAccessories[occurrence];
  expandSets(exercise).forEach((_, si) => {
    delete state.completions[setKey(state.week, state.day, exKey, si)];
  });
  saveState();
  render();
}

function renderNav() {
  const nav = document.getElementById('nav');
  let html = '<div class="nav-section weekly-nav">';
  PROGRAM[state.week].days.forEach((d, di) => {
    const active = di === state.day ? 'active' : '';
    const prog = getDayProgress(state.week, di);
    const check = (!d.rest && prog.pct === 100) ? ' &#10003;' : '';
    html += `<div class="nav-tab ${active}${d.rest ? ' rest' : ''}" onclick="selectDay(${di})">J${di + 1} · ${d.shortName}${check}</div>`;
  });
  html += '</div>';
  nav.innerHTML = html;
}

function renderContent() {
  const content = document.getElementById('content');
  const dayData = PROGRAM[state.week].days[state.day];

  if (dayData.rest) {
    content.innerHTML = `
      <div class="rest-day">
        <div class="icon">&#128564;</div>
        <h2>Repos</h2>
        <p>Récupère bien. Mange. Dors. Reviens plus fort.</p>
      </div>`;
    return;
  }

  const prog = getDayProgress(state.week, state.day);
  let html = `
    <div class="day-header">
      <h2>${dayData.name}</h2>
      <p>Jour ${state.day + 1}/7 · Semaine ${state.cycle}</p>
      <div class="day-progress">
        <div class="progress-bar"><div class="progress-fill" style="width:${prog.pct}%"></div></div>
        <span class="progress-text">${prog.done}/${prog.total}</span>
      </div>
    </div>`;

  const sessionExercises = getSessionExercises(state.week, state.day);
  let currentSection = "";
  let workIndex = 0;
  sessionExercises.forEach((ex, ei) => {
    const section = ex.preFatigue ? "Pré-fatigue" : ex.isFreestyle ? "Freestyle jambes" : "Exercices";
    if (section !== currentSection) {
      html += `<div class="workout-section-title"><span>${section}</span></div>`;
      currentSection = section;
    }
    const exKey = exerciseCompletionKey(ex, ei);
    const sets = getExerciseSets(ex);
    const allDone = sets.every((_, si) => isSetDone(state.week, state.day, exKey, si));
    const cardClass = allDone ? 'exercise-card completed' : 'exercise-card';

    const tag = ex.preFatigue ? "P" : ex.isFreestyle ? "F" : ex.isExtra ? "+" : String(++workIndex);
    html += `<div class="${cardClass}${ex.isExtra ? ' extra-accessory' : ''}${ex.preFatigue ? ' pre-fatigue-card' : ''}${ex.isFreestyle ? ' freestyle-card' : ''}">`;
    html += `<div class="exercise-header">`;
    html += `<div class="exercise-tag">${tag}</div>`;
    html += `<div class="exercise-title"><div class="exercise-name">${ex.name}</div>`;
    html += `<div class="exercise-meta">${ex.tempo ? `<span>${ex.tempo}</span>` : ''}${ex.rpe ? `<span>RPE ${ex.rpe}</span>` : ''}${ex.rest ? `<span>${ex.rest / 60} min repos</span>` : ''}</div></div>`;
    if (ex.preFatigue) {
      const selectedSets = state.preFatigueSets[ex.id] || 1;
      html += `<div class="set-choice" onclick="event.stopPropagation()"><button class="${selectedSets === 1 ? 'active' : ''}" onclick="setPreFatigueSetCount('${ex.id}',1)">1</button><button class="${selectedSets === 2 ? 'active' : ''}" onclick="setPreFatigueSetCount('${ex.id}',2)">2</button></div>`;
    }
    if (ex.isFreestyle) {
      html += `<div class="freestyle-controls" onclick="event.stopPropagation()"><button onclick="changeFreestyleSetCount(-1)" aria-label="Retirer une série">−</button><span>${sets.length} séries</span><button onclick="changeFreestyleSetCount(1)" aria-label="Ajouter une série">+</button><button onclick="openFreestylePicker()" aria-label="Changer d'exercice">↻</button><button onclick="removeFreestyleExercise()" aria-label="Retirer l'exercice">×</button></div>`;
    }
    if (ex.isExtra) {
      html += `<button class="remove-extra-btn" onclick="event.stopPropagation();removeExtraAccessory('${ex.id}')" title="Retirer de cette séance" aria-label="Retirer ${escAttr(ex.name)}">&times;</button>`;
    }
    html += `<div class="exercise-check">${allDone ? '&#10003;' : ''}</div>`;
    html += `</div>`;
    html += `<div class="sets-container">`;

    // Accessory free-text note (réglage siège, cues…) — entre le titre et les séries
    if (!ex.ref) {
      const note = getCustomNote(ex.name);
      const exNameEsc = ex.name.replace(/"/g, '&quot;');
      html += `<div class="acc-note-row"><input type="text" class="acc-note-input${note ? '' : ' empty'}" placeholder="&#128221; Note (ex. r&eacute;glage si&egrave;ge, prise, cran&hellip;)" value="${escAttr(note)}" data-exname="${exNameEsc}" onclick="event.stopPropagation()" onchange="onNoteInputChange(this)"></div>`;
    }

    sets.forEach((set, si) => {
      const done = isSetDone(state.week, state.day, exKey, si);
      const rowClass = done ? 'set-row done' : 'set-row';
      const checkClass = done ? 'set-checkbox checked' : 'set-checkbox';

      // Build set info
      let info = '';

      if (set.pct !== undefined && set.ref) {
        // PR-based exercise: fixed reps + calculated weight
        info += '<span class="reps">';
        if (set.r === "AMRAP") {
          info += `1 rep</span><span class="amrap-badge">AMRAP</span>`;
        } else {
          info += `${set.r} rep${set.r > 1 ? 's' : ''}</span>`;
        }
        const kg = calcWeight(set.pct, set.ref);
        if (kg !== null) {
          const actualPct = Math.round(kg / getMax(set.ref) * 100);
          info += `<span class="weight">${kg} kg</span>`;
          info += `<span class="pct">(${actualPct}%)</span>`;
        }
      } else if (!set.ref) {
        // Accessory exercise: editable reps + editable weight (double progression)
        const gi = set.groupIndex;
        const exNameEsc = ex.name.replace(/"/g, '&quot;');
        const programReps = set.r === "AMRAP" || set.r === "MAX" ? "MAX" : set.r;

        // Reps input (independent per set — keyed by absolute set index si)
        const cr = getCustomReps(ex.name, si);
        const repsVal = (cr !== null) ? cr : '';
        const repsEmpty = (cr === null) ? ' empty' : '';
        info += `<input type="number" step="1" inputmode="numeric" class="acc-input reps-input${repsEmpty}" placeholder="${programReps}" value="${repsVal}" data-exname="${exNameEsc}" data-set="${si}" data-ekey="${exKey}" onclick="event.stopPropagation()" onchange="onRepsInputChange(this)">`;
        info += `<span class="acc-unit">${ex.tracking === "time" ? "sec" : "reps"}</span>`;

        info += `<span class="acc-x">&times;</span>`;

        // Weight input
        const cw = getCustomWeight(ex.name, gi);
        const weightVal = (cw !== null) ? cw : '';
        const weightEmpty = (cw === null) ? ' empty' : '';
        info += `<input type="number" step="0.5" inputmode="decimal" class="acc-input weight-input${weightEmpty}" placeholder="—" value="${weightVal}" data-exname="${exNameEsc}" data-group="${gi}" onclick="event.stopPropagation()" onchange="onWeightInputChange(this)">`;
        info += `<span class="acc-unit">kg</span>`;
      } else {
        // Fallback (shouldn't happen): just show reps
        info += '<span class="reps">';
        if (set.r === "AMRAP") {
          info += `1 rep</span><span class="amrap-badge">AMRAP</span>`;
        } else {
          info += `${set.r} rep${set.r > 1 ? 's' : ''}</span>`;
        }
      }

      if (set.rpe !== undefined) {
        info += `<span class="rpe">RPE ${set.rpe}</span>`;
      }

      // Accessory range label (right-aligned)
      const range = (!set.ref && !ex.ref) ? (ex.range || ACC_RANGES[ex.name]) : null;
      if (range) {
        info += `<span class="acc-range">${range}</span>`;
      }

      html += `<div class="${rowClass}">`;
      html += `<div class="${checkClass}" onclick="toggleSetDone(${state.week},${state.day},'${exKey}',${si})">&#10003;</div>`;
      html += `<div class="set-info">${info}</div>`;
      html += `</div>`;
    });

    if (!ex.preFatigue && !ex.isFreestyle) {
      const rangeStr = ex.range || ACC_RANGES[ex.name] || '6-10';
      const rangeParts = rangeStr.split('-').map(value => parseInt(value, 10));
      const upper = rangeParts[1] || rangeParts[0] || 10;
      const target = sets.length * upper;
      let achieved = 0, allReady = sets.length > 0;
      sets.forEach((_, si) => {
        const r = getCustomReps(ex.name, si);
        const done = isSetDone(state.week, state.day, exKey, si);
        if (done && r !== null) achieved += r;
        if (!done || r === null) allReady = false;
      });
      const allMet = allReady && achieved >= target;
      html += `<div class="acc-total${allMet ? ' met' : ''}">`;
      html += `<span class="acc-total-count">${allMet ? '&#10003; ' : ''}Total : ${achieved}/${target}</span>`;
      html += `<span class="acc-total-cond">Cible : ${rangeStr} par série · RPE ${ex.rpe || 'libre'}</span>`;
      html += `</div>`;
    }

    html += `</div></div>`;
  });

  if (dayData.freestyle && !state.freestyleSelections[sessionOccurrenceKey()]) {
    html += `<button class="freestyle-picker-btn" onclick="openFreestylePicker()"><span>+</span><strong>Choisir l'exercice libre jambes</strong><small>Squat, presse, deadlift, fentes et autres classiques</small></button>`;
  }

  html += `<button class="add-accessory-btn" onclick="openAccessoryPicker()">`
    + `<span aria-hidden="true">+</span> Ajouter un accessoire</button>`;

  // Session validation footer — valider une séance partielle OU complète vers l'historique
  {
    const sp = getDayProgress(state.week, state.day);
    const logged = isSessionLogged(state.week, state.day);
    if (logged || sp.done > 0) {
      html += `<div class="session-validate">`;
      if (logged) {
        html += `<span class="session-validate-ok">&#10003; Séance enregistrée dans l'historique (${sp.done}/${sp.total})</span>`;
        html += `<button class="btn-devalider" onclick="devalidateSession(${state.week},${state.day})">Dévalider</button>`;
      } else {
        html += `<button class="btn-valider" onclick="showValidateModal(${state.week},${state.day})">Valider la séance (${sp.done}/${sp.total})</button>`;
      }
      html += `</div>`;
    }
  }

  // Cycle advancement banner
  if (isBlocComplete(0)) {
    html += `
      <div style="text-align:center;margin-top:32px;padding:24px;background:var(--bg2);border:1px solid var(--green-dim);border-radius:var(--radius);">
        <h3 style="color:var(--green);margin-bottom:8px;">Semaine ${state.cycle} terminée</h3>
        <p style="color:var(--text2);margin-bottom:16px;">Les quatre entraînements sont complétés.</p>
        <button onclick="advanceCycle()" style="padding:10px 24px;background:var(--green-dim);border:1px solid var(--green);color:var(--green);border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;">
          Commencer la semaine ${state.cycle + 1}
        </button>
      </div>`;
  }

  content.innerHTML = html;
}

  document.getElementById('cycleDisplay').textContent = `Semaine ${state.cycle}`;
  renderNav();

// ============================================================
// TIMER
// ============================================================
let timerAudioContext = null;

function unlockTimerAudio() {
  try {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return null;
    if (!timerAudioContext) timerAudioContext = new AudioContextClass();
    if (timerAudioContext.state === 'suspended') timerAudioContext.resume();

    // iOS requires audio to be initialized during a user interaction.
    const oscillator = timerAudioContext.createOscillator();
    const gain = timerAudioContext.createGain();
    oscillator.connect(gain);
    gain.connect(timerAudioContext.destination);
    gain.gain.value = 0;
    oscillator.start();
    oscillator.stop(timerAudioContext.currentTime + 0.01);
    return timerAudioContext;
  } catch(e) {
    return null;
  }
}

function setTimer(seconds) {
  state.timerDuration = seconds;
  state.timerRemaining = seconds;
  if (state.timerRunning) {
    clearInterval(state.timerInterval);
    state.timerRunning = false;
  }
  updateTimerDisplay();
}

function startRestTimer(seconds) {
  setTimer(seconds);
  toggleTimer();
}

function toggleTimer() {
  if (state.timerRunning) {
    clearInterval(state.timerInterval);
    state.timerRunning = false;
    document.getElementById('timerBtn').textContent = 'Start';
  } else {
    if (state.timerRemaining <= 0) {
      state.timerRemaining = state.timerDuration;
    }
    unlockTimerAudio();
    state.timerRunning = true;
    document.getElementById('timerBtn').textContent = 'Pause';
    state.timerInterval = setInterval(() => {
      state.timerRemaining--;
      if (state.timerRemaining <= 0) {
        state.timerRemaining = 0;
        clearInterval(state.timerInterval);
        state.timerRunning = false;
        document.getElementById('timerBtn').textContent = 'Start';
        playAlarm();
      }
      updateTimerDisplay();
    }, 1000);
  }
  updateTimerDisplay();
}

function resetTimer() {
  clearInterval(state.timerInterval);
  state.timerRunning = false;
  state.timerRemaining = state.timerDuration;
  document.getElementById('timerBtn').textContent = 'Start';
  updateTimerDisplay();
}

function updateTimerDisplay() {
  const el = document.getElementById('timerDisplay');
  const context = document.getElementById('timerContext');
  const mins = Math.floor(state.timerRemaining / 60);
  const secs = state.timerRemaining % 60;
  el.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
  if (context) context.textContent = 'Repos série';
  el.className = 'timer-display';
  if (state.timerRemaining <= 10 && state.timerRemaining > 0 && state.timerRunning) {
    el.classList.add('warning');
  } else if (state.timerRemaining === 0) {
    el.classList.add('done');
  }
}

function playAlarm() {
  try {
    const ctx = unlockTimerAudio();
    if (!ctx) return;
    [0, 250, 500].forEach(delay => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 880;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.45, ctx.currentTime + delay/1000);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + delay/1000 + 0.2);
      osc.start(ctx.currentTime + delay/1000);
      osc.stop(ctx.currentTime + delay/1000 + 0.2);
    });
  } catch(e) {}
}

async function logout() {

function buildLocalBackup() {
  let program = null;
  let history = { sessions: [], maxHistory: [] };
  try { program = JSON.parse(localStorage.getItem('muscu_program')); } catch(e) {}
  try { history = JSON.parse(localStorage.getItem('muscu_history')) || history; } catch(e) {}
  return {
    schemaVersion: 1,
    application: 'skin-grinding',
    exportedAt: new Date().toISOString(),
    data: { program, history }
  };
}

async function exportLocalData() {
  const backup = buildLocalBackup();
  const json = JSON.stringify(backup, null, 2);
  const date = backup.exportedAt.slice(0, 10);
  const filename = `skin-grinding-backup-${date}.json`;
  const blob = new Blob([json], { type: 'application/json' });
  const file = new File([blob], filename, { type: 'application/json' });

  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({
        files: [file],
        title: 'Sauvegarde Skin Grinding'
      });
    } else {
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }
    const sessionCount = backup.data.history.sessions?.length || 0;
    alert(`Sauvegarde créée : ${sessionCount} séance${sessionCount > 1 ? 's' : ''}.`);
  } catch (error) {
    if (error?.name !== 'AbortError') {
      alert('Impossible de créer la sauvegarde. Réessaie depuis Safari.');
    }
  }
}
