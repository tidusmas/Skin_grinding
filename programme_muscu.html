<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1117">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Skin Grinding</title>
<style>
:root {
  --bg: #090b0c;
  --bg2: #121516;
  --bg3: #1a1f20;
  --surface-raised: #202627;
  --border: #303738;
  --border-strong: #465052;
  --text: #f1f4f2;
  --text2: #9ba5a2;
  --green: #51d47b;
  --green-dim: #173d27;
  --blue: #68b8e8;
  --orange: #e6ae5c;
  --red: #f06b6b;
  --purple: #b69de8;
  --radius: 8px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; }
button { touch-action: manipulation; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

/* HEADER */
.header {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header h1 { font-size: 20px; font-weight: 700; }
.header h1 span { color: var(--green); }
.header-right { display: flex; align-items: center; gap: 12px; }
.sync-status { display:inline-flex; align-items:center; gap:6px; color:var(--text2); font-size:11px; white-space:nowrap; }
.sync-status::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--text2); }
.sync-status.saved::before { background:var(--green); }
.sync-status.saving::before { background:var(--orange); }
.sync-status.offline::before, .sync-status.error::before { background:var(--red); }
.btn-icon {
  background: none;
  border: 1px solid var(--border);
  color: var(--text2);
  width: 36px;
  height: 36px;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  transition: all .15s;
}
.btn-icon:hover { background: var(--bg3); color: var(--text); border-color: var(--text2); }

/* NAV */
.nav {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  gap: 0;
  overflow-x: auto;
}
.nav-section {
  display: flex;
  align-items: stretch;
}
.nav-section:first-child { border-right: 1px solid var(--border); margin-right: 8px; padding-right: 8px; }
.nav-tab {
  appearance: none;
  background: transparent;
  border: 0;
  padding: 12px 16px;
  cursor: pointer;
  color: var(--text2);
  font-size: 14px;
  font-weight: 500;
  border-bottom: 2px solid transparent;
  transition: all .15s;
  white-space: nowrap;
  user-select: none;
}
.nav-tab:hover { color: var(--text); background: var(--bg3); }
.nav-tab.active { color: var(--green); border-bottom-color: var(--green); }
.nav-tab.rest { color: var(--text2); opacity: .5; font-style: italic; }
/* "locked" = pas encore débloquée : grisée mais cliquable (révision libre) */
.nav-tab.locked { opacity: 0.5; color: var(--text2); }

/* CONTENT */
.content {
  max-width: 800px;
  margin: 0 auto;
  padding: 24px;
}
.day-header {
  margin-bottom: 24px;
}
.day-header h2 { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
.day-header p { color: var(--text2); font-size: 14px; }
.day-progress {
  margin-top: 12px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.progress-bar {
  flex: 1;
  height: 6px;
  background: var(--bg3);
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--green);
  border-radius: 3px;
  transition: width .3s ease;
}
.progress-text { font-size: 13px; color: var(--text2); min-width: 40px; }

/* REST DAY */
.rest-day {
  text-align: center;
  padding: 80px 24px;
}
.rest-day .icon { font-size: 64px; margin-bottom: 16px; }
.rest-day h2 { font-size: 28px; margin-bottom: 8px; }
.rest-day p { color: var(--text2); font-size: 16px; }

/* EXERCISE CARD */
.exercise-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 16px;
  overflow: hidden;
  transition: border-color .15s;
}
.exercise-card.completed { border-color: var(--green-dim); }
.exercise-card.skipped { border-color:#765c34; }
.exercise-card.skipped .sets-container { opacity:.48; }
.exercise-header {
  display: flex;
  align-items: center;
  padding: 14px 16px;
  gap: 12px;
  cursor: pointer;
  user-select: none;
}
.exercise-tag {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--green);
  color: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 14px;
  flex-shrink: 0;
}
.exercise-name { font-weight: 600; font-size: 16px; flex: 1; }
.exercise-instructions { margin-top:5px; color:var(--text2); font-size:12px; line-height:1.35; }
.skip-select { min-height:34px; max-width:132px; padding:5px 24px 5px 7px; border:1px solid var(--border); border-radius:6px; background:var(--bg3); color:var(--text2); font-size:11px; }
.skip-select.active { border-color:var(--orange); color:var(--orange); }
.exercise-check {
  color: var(--text2);
  font-size: 18px;
}
.exercise-card.completed .exercise-check { color: var(--green); }

/* SET ROWS */
.sets-container { padding: 0 16px 12px; }
.set-row {
  display: flex;
  align-items: center;
  padding: 8px 0;
  gap: 12px;
  border-top: 1px solid var(--border);
  transition: opacity .15s;
}
.set-row.done { opacity: .5; }
.set-checkbox {
  width: 22px;
  height: 22px;
  border: 2px solid var(--border);
  border-radius: 4px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all .15s;
  color: transparent;
  font-size: 14px;
  background: transparent;
}
.set-checkbox:hover { border-color: var(--green); }
.set-checkbox.checked {
  background: var(--green);
  border-color: var(--green);
  color: #000;
}
.set-info { flex: 1; font-size: 14px; }
.set-info .reps { font-weight: 600; }
.set-info .weight { color: var(--blue); margin-left: 6px; font-weight: 600; }
.set-info .pct { color: var(--text2); margin-left: 4px; font-size: 12px; }
.set-info .rpe { color: var(--orange); margin-left: 8px; font-size: 12px; font-weight: 600; }
.set-info .amrap-badge {
  background: var(--red);
  color: #fff;
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 700;
  margin-left: 6px;
}
.acc-input {
  width: 48px;
  min-height: 34px;
  padding: 4px 5px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 5px;
  font-size: 13px;
  font-weight: 600;
  text-align: center;
  font-family: inherit;
  -moz-appearance: textfield;
}
.acc-input::-webkit-outer-spin-button,
.acc-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.acc-input:focus { outline: none; }
.acc-input.empty { border-style: dashed; }
.acc-input.reps-input { color: var(--green); width: 42px; }
.acc-input.reps-input:focus { border-color: var(--green); }
.acc-input.reps-input.empty { color: var(--text2); }
.acc-input.weight-input { color: var(--blue); width: 52px; }
.acc-input.weight-input:focus { border-color: var(--blue); }
.acc-input.weight-input.empty { color: var(--text2); }
.acc-unit { color: var(--text2); font-size: 11px; margin-left: 1px; margin-right: 6px; }
.acc-x { color: var(--text2); font-size: 12px; margin: 0 4px; }
.acc-range {
  margin-left: auto;
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--bg3);
  border: 1px solid var(--border);
  font-size: 11px;
  font-weight: 600;
  color: var(--text2);
  white-space: nowrap;
  flex-shrink: 0;
}

/* ACCESSORY NOTE (free text, above the sets) */
.acc-note-row { padding: 10px 0 4px; }
.acc-note-input {
  width: 100%;
  padding: 6px 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
}
.acc-note-input::placeholder { color: var(--text2); }
.acc-note-input:focus { outline: none; border-color: var(--blue); }
.acc-note-input.empty { border-style: dashed; }

/* TEMPORARY ACCESSORIES */
.exercise-card.extra-accessory { border-color: var(--blue); }
.exercise-card.extra-accessory .exercise-tag { background: var(--blue); }
.remove-extra-btn {
  width: 30px;
  height: 30px;
  border: 0;
  background: transparent;
  color: var(--text2);
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
}
.remove-extra-btn:hover { color: var(--red); }
.add-accessory-btn {
  width: 100%;
  min-height: 46px;
  margin: 4px 0 16px;
  border: 1px dashed var(--blue);
  border-radius: 8px;
  background: transparent;
  color: var(--blue);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}
.add-accessory-btn:hover { background: var(--bg2); }
.accessory-picker-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: min(58vh, 520px);
  overflow-y: auto;
  margin-top: 14px;
}
.accessory-picker-item {
  width: 100%;
  padding: 11px 12px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--bg3);
  color: var(--text);
  text-align: left;
  cursor: pointer;
}
.accessory-picker-item:hover { border-color: var(--blue); }
.accessory-picker-item:disabled { opacity: .45; cursor: default; }
.accessory-picker-name { display: block; font-size: 14px; font-weight: 600; }
.accessory-picker-meta { display: block; margin-top: 3px; color: var(--text2); font-size: 12px; }

/* ACCOUNT */
.account-separator {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 14px 0;
  color: var(--text2);
  font-size: 12px;
}
.account-separator::before, .account-separator::after {
  content: "";
  height: 1px;
  flex: 1;
  background: var(--border);
}
.login-box button.account-login-btn {
  background: var(--bg3);
  border: 1px solid var(--blue);
  color: var(--blue);
}
.account-fields { display: grid; gap: 10px; margin-top: 16px; }
.account-fields label { color: var(--text2); font-size: 12px; }
.account-fields input {
  width: 100%;
  margin-top: 4px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  color: var(--text);
  font: inherit;
}
.account-fields input:focus { outline: none; border-color: var(--blue); }
.account-message { min-height: 18px; margin-top: 10px; color: var(--text2); font-size: 12px; }
.account-message.error { color: var(--red); }
.account-message.success { color: var(--green); }
.account-link-btn {
  border: 0;
  background: transparent;
  color: var(--blue);
  cursor: pointer;
  font: inherit;
  font-size: 12px;
}
.account-status { color: var(--green); font-size: 12px; }

/* SESSION VALIDATION FOOTER */
.session-validate {
  margin-top: 24px;
  padding: 16px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  flex-wrap: wrap;
}
.btn-valider {
  padding: 12px 28px;
  background: var(--green-dim);
  border: 1px solid var(--green);
  color: var(--green);
  border-radius: 8px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: all .15s;
}
.btn-valider:hover { background: var(--green); color: #000; }
.session-validate-ok { color: var(--green); font-weight: 600; font-size: 14px; }
.btn-devalider {
  padding: 8px 16px;
  background: #5c1a1a;
  border: 1px solid var(--red);
  color: var(--red);
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
}
.btn-devalider:hover { background: var(--red); color: #fff; }

/* TIMER */
.timer-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg2);
  border-top: 1px solid var(--border);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  z-index: 100;
}
.timer-display {
  font-size: 32px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  min-width: 100px;
  text-align: center;
}
.timer-display.warning { color: var(--orange); }
.timer-display.done { color: var(--green); }
.timer-btn {
  padding: 8px 20px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg3);
  color: var(--text);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
}
.timer-btn:hover { background: var(--border); }
.timer-btn.primary { background: var(--green-dim); border-color: var(--green); color: var(--green); }
.timer-btn.primary:hover { background: var(--green); color: #000; }
/* SETTINGS MODAL */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.7);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  width: 400px;
  max-width: 90vw;
}
.modal h3 { margin-bottom: 16px; font-size: 18px; }
.modal label { display: block; color: var(--text2); font-size: 13px; margin-bottom: 6px; margin-top: 14px; }
.modal input[type="date"], .modal input[type="number"] {
  width: 100%;
  padding: 8px 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 14px;
}
.modal-actions { display: flex; gap: 8px; margin-top: 20px; justify-content: flex-end; flex-wrap: wrap; }
.modal-actions button {
  padding: 8px 16px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg3);
  color: var(--text);
  cursor: pointer;
  font-size: 14px;
}
.modal-actions .save { background: var(--green-dim); border-color: var(--green); color: var(--green); }
.modal-actions .danger { background: #5c1a1a; border-color: var(--red); color: var(--red); }
.settings-actions { display: grid; gap: 8px; width: 100%; }
.settings-actions-main {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}
.settings-actions-main button { min-width: 0; }
.settings-actions-footer { display: flex; justify-content: flex-end; gap: 8px; }
/* SCROLLBAR */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text2); }

/* Extra bottom padding for timer */
.content { padding-bottom: 180px; }

/* PAGE TOGGLE */
.page-toggle {
  display: flex;
  gap: 0;
  background: var(--bg3);
  border-radius: 8px;
  padding: 2px;
  margin-left: 12px;
}
.page-toggle button {
  padding: 6px 14px;
  border: none;
  background: none;
  color: var(--text2);
  font-size: 13px;
  font-weight: 600;
  border-radius: 6px;
  cursor: pointer;
  transition: all .15s;
}
.page-toggle button.active { background: var(--green-dim); color: var(--green); }
.page-toggle button:hover:not(.active) { color: var(--text); }

/* HISTORY PAGE */
.history-container { max-width: 900px; margin: 0 auto; padding: 24px; padding-bottom: 180px; }
.history-container h2 { font-size: 22px; margin-bottom: 20px; }

.session-log {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 12px;
  overflow: hidden;
}
.session-header {
  width: 100%;
  border: 0;
  background: transparent;
  color: inherit;
  text-align: left;
  display: flex;
  align-items: center;
  padding: 12px 16px;
  gap: 12px;
  cursor: pointer;
  user-select: none;
}
.session-header:hover { background: var(--bg3); }
.session-date { font-weight: 600; min-width: 100px; }
.session-label { flex: 1; color: var(--text2); font-size: 14px; }
.session-badge {
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 700;
}
.session-badge.complete { background: var(--green-dim); color: var(--green); }
.session-badge.partial { background: #3d2e00; color: var(--orange); }
.session-detail {
  padding: 0 16px 12px;
  display: none;
  border-top: 1px solid var(--border);
}
.session-detail.open { display: block; padding-top: 12px; }
.session-exercise { margin-bottom: 8px; }
.session-exercise-name { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
.session-sets { font-size: 12px; color: var(--text2); }
.history-set-done { color:var(--green); }
.history-set-missed { color:var(--text2); opacity:.7; }
.history-note { margin-top:6px; color:var(--text2); font-size:12px; font-style:italic; }
.session-date {
  min-width: 78px;
  color: var(--text);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}

.empty-history {
  text-align: center;
  padding: 60px 24px;
  color: var(--text2);
}
.empty-history .icon { font-size: 48px; margin-bottom: 12px; }
.empty-history.compact { padding:28px 16px; }
.history-title-row p { margin-top:-14px; margin-bottom:18px; color:var(--text2); font-size:13px; }
.history-summary { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin-bottom:14px; }
.history-summary > div { display:grid; gap:3px; padding:12px; border:1px solid var(--border); border-radius:8px; background:var(--bg2); }
.history-summary strong { font-size:21px; }
.history-summary span { color:var(--text2); font-size:11px; }
.history-toolbar { margin-bottom:16px; }
.history-toolbar input { width:100%; min-height:42px; padding:9px 12px; border:1px solid var(--border); border-radius:7px; background:var(--bg2); color:var(--text); }
.history-more { width:100%; min-height:44px; margin-top:4px; border:1px solid var(--border); border-radius:7px; background:var(--bg2); color:var(--blue); font-weight:700; }
.history-archive-note { margin-top:18px; color:var(--text2); font-size:11px; text-align:center; }

/* POLISHED APP SHELL */
.header {
  padding: calc(12px + var(--safe-top)) 24px 12px;
  background: rgba(18, 21, 22, .96);
  backdrop-filter: blur(16px);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark {
  width: 8px;
  height: 32px;
  border-radius: 2px;
  background: var(--green);
  box-shadow: 0 0 18px rgba(81, 212, 123, .22);
}
.brand-copy { display: grid; gap: 1px; min-width: 0; }
.brand-name { font-size: 17px; font-weight: 750; line-height: 1.1; }
.brand-cycle { color: var(--text2); font-size: 12px; font-weight: 600; }
.brand-cycle strong { color: var(--green); }
.btn-icon { border-radius: 6px; }
.nav { scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav-tab { min-height: 44px; padding-bottom: 10px; }
.content { max-width: 760px; }
.day-header { margin-bottom: 20px; }
.day-header h2 { font-size: 23px; font-weight: 750; line-height: 1.2; }
.progress-bar { height: 7px; }
.exercise-card { margin-bottom: 12px; transition: border-color .15s, background .15s; }
.exercise-card.completed { border-color: #2f6340; background: #111815; }
.exercise-header { min-height: 58px; padding: 12px 14px; }
.exercise-tag {
  width: 30px;
  height: 30px;
  border-radius: 6px;
  background: var(--green-dim);
  border: 1px solid #2f7045;
  color: var(--green);
}
.set-row { min-height: 50px; padding: 7px 0; gap: 10px; }
.set-row.done { opacity: 1; }
.set-row.done .set-info { opacity: .64; }
.set-checkbox { width: 28px; height: 28px; }
.set-checkbox.checked { color: #071009; }
.set-info {
  min-width: 0;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  row-gap: 5px;
}
.acc-input { min-height: 36px; padding-block: 6px; }
.acc-range { padding: 4px 7px; }

<script>
// ============================================================

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAa_mArHrX4Qs9rtX7pWHh_Ctyp-8qIQ38",
  authDomain: "skin-grinding.firebaseapp.com",
  databaseURL: "https://skin-grinding-default-rtdb.firebaseio.com",
  projectId: "skin-grinding",
  storageBucket: "skin-grinding.firebasestorage.app",
  messagingSenderId: "94530619554",
  appId: "1:94530619554:web:4d54f18fa30a1f7f442ffb"
};

const APP_VERSION = "2.1.0";
const PROGRAM_ID = "upper-lower-2026-v1";
const INITIAL_RUN_ID = "initial-run";
const STORAGE_PROGRAM = "muscu_program";
const STORAGE_HISTORY = "muscu_history";
const STORAGE_RECOVERY = "muscu_recovery";
const STORAGE_TIMER = "muscu_timer";
const STORAGE_LEGACY_OWNER = "muscu_legacy_owner_uid";
let activeStorageUid = null;

function storageKey(base, uid = activeStorageUid) {
  return uid ? `${base}:${uid}` : base;
}

function activateAccountStorage(uid, options = {}) {
  activeStorageUid = uid || null;
  if (!uid) return;
  if (options.claimLegacy === false) return;

  const owner = localStorage.getItem(STORAGE_LEGACY_OWNER);
  const mayClaimLegacyData = !owner || owner === uid;
  if (mayClaimLegacyData) {
    [STORAGE_PROGRAM, STORAGE_HISTORY].forEach(base => {
      const scopedKey = storageKey(base, uid);
      const legacyValue = localStorage.getItem(base);
      if (localStorage.getItem(scopedKey) === null && legacyValue !== null) {
        localStorage.setItem(scopedKey, legacyValue);
      }
    });
    if (!owner) localStorage.setItem(STORAGE_LEGACY_OWNER, uid);
  }
}

function createRunId() {
  if (window.crypto?.randomUUID) return window.crypto.randomUUID();
  return `run-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
}

let accountAuth = null;
let accountDatabase = null;
let accountUser = null;
let accountApplyingRemote = false;
let accountProgramTimer = null;
let accountListeners = [];
let accountRemoteSessions = {};
let accountRemoteMaxHistory = {};
let accountRemoteTombstones = {};
let accountHistoryClearedAt = 0;
let accountHistoryApplyTimer = null;

function setSyncStatus(status, label) {
  const el = document.getElementById("syncStatus");
  if (!el) return;
  const text = label || ({ saved: "Synchronisé", saving: "Synchronisation…", offline: "Hors ligne", error: "Erreur de synchro" }[status] || "");
  el.className = `sync-status ${status || ""}`;
  el.textContent = text;
  el.title = text;
}

function prepareProgramForCloud(data) {
  if (!data) return data;
  const cloud = { ...data };
  delete cloud.day;
  delete cloud.week;
  delete cloud.timerDuration;
  delete cloud.timerRemaining;
  delete cloud.timerRunning;
  return cloud;
}

function accountSessionKey(session) {
  const clean = value => String(value ?? "legacy").replace(/[.#$\[\]\/]/g, "-");
  return [
    clean(effectiveSessionProgramId(session)),
    clean(effectiveSessionRunId(session)),
    `c${session.cycle || 1}`,
    `w${session.week ?? 0}`,
    `d${session.day ?? 0}`
  ].join("_");
}

function historyToCloudMap(history) {
  const sessions = {};
  const maxHistory = {};
  (history.sessions || []).forEach(session => {
    sessions[accountSessionKey(session)] = session;
  });
  (history.maxHistory || []).forEach(entry => {
    if (entry?.date) maxHistory[entry.date] = entry;
  });
  return { sessions, maxHistory };
}

function cloudMapToHistory(data) {
  return {
    sessions: Object.values(data?.sessions || {}),
    maxHistory: Object.values(data?.maxHistory || {})
  };
}

function getLocalProgramData() {
  try {
    return JSON.parse(localStorage.getItem(storageKey(STORAGE_PROGRAM))) || null;
  } catch(e) {
    return null;
  }
}

function setAccountMessage(message, type = "") {
  const el = document.getElementById("accountMessage");
  if (!el) return;
  el.textContent = message;
  el.className = `account-message${type ? " " + type : ""}`;
}

function setWelcomeMessage(message, type = "") {
  const el = document.getElementById("welcomeMessage");
  el.textContent = message;
  el.className = `login-error${type ? " " + type : ""}`;
}

function accountErrorMessage(error) {
  const code = error?.code || "";
  if (code.includes("invalid-credential")) return "E-mail ou mot de passe incorrect.";
  if (code.includes("email-already-in-use")) return "Un compte existe déjà avec cet e-mail.";
  if (code.includes("weak-password")) return "Le mot de passe doit contenir au moins 6 caractères.";
  if (code.includes("invalid-email")) return "Adresse e-mail invalide.";
  if (code.includes("wrong-password")) return "Le mot de passe actuel est incorrect.";
  if (code.includes("requires-recent-login")) return "Reconnecte-toi avant de modifier le mot de passe.";
  if (code.includes("too-many-requests")) return "Trop de tentatives. Réessaie plus tard.";
  if (code.includes("network-request-failed")) return "Connexion réseau indisponible.";
  return "Une erreur est survenue. Réessaie.";
}

function updateAccountModal() {
  const connected = !!accountUser;
  document.getElementById("accountStatus").textContent =
    connected ? `Connecté : ${accountUser.email}` : "";
  document.getElementById("accountChangeFields").style.display = connected ? "grid" : "none";
  document.getElementById("accountLogoutBtn").style.display = connected ? "" : "none";
  document.getElementById("accountChangePasswordBtn").style.display = connected ? "" : "none";
  if (connected) setAccountMessage("Synchronisation active.", "success");
}

function openAccountModal() {
  if (!accountUser) {
    closeSettings();
    document.getElementById("loginOverlay").style.display = "flex";
    return;

    return;

  const currentPassword = document.getElementById("accountCurrentPassword").value;
  const newPassword = document.getElementById("accountNewPassword").value;

  if (!currentPassword || !newPassword || !confirmation) {

    return;
  }
  if (newPassword.length < 6) {

  }
  if (newPassword !== confirmation) {

  setAccountMessage("Modification du mot de passe...");
  try {
    const credential = firebase.auth.EmailAuthProvider.credential(accountUser.email, currentPassword);
    await accountUser.reauthenticateWithCredential(credential);

    ["accountCurrentPassword", "accountNewPassword", "accountNewPasswordConfirm"].forEach(id => {
      document.getElementById(id).value = "";
    });
    setAccountMessage("Mot de passe modifié.", "success");
  } catch(error) {
    setAccountMessage(accountErrorMessage(error), "error");
  }

function applyCloudProgram(program) {
  if (!program || typeof program !== "object") return;
  const requiresMigration = program.programVersion !== PROGRAM_VERSION || program.weightDataVersion !== WEIGHT_DATA_VERSION;
  const local = getLocalProgramData();
  const mergedProgram = {
    ...program,
    week: local?.week ?? state.week,
    day: local?.day ?? state.day,
    timerDuration: local?.timerDuration ?? state.timerDuration
  };
  accountApplyingRemote = true;
  localStorage.setItem(storageKey(STORAGE_PROGRAM), JSON.stringify(mergedProgram));
  loadState();
  accountApplyingRemote = false;
  if (requiresMigration) scheduleAccountProgramSync(getLocalProgramData());
  render();
}

function applyCloudHistory(remoteHistory, tombstones = accountRemoteTombstones, clearedAt = accountHistoryClearedAt) {
  const merged = mergeHistory(loadHistory(), remoteHistory);
  merged.sessions = merged.sessions.filter(session => {
    const updatedAt = session.updatedAt || 0;
    if (clearedAt && updatedAt <= clearedAt) return false;
    const deletedAt = tombstones[accountSessionKey(session)] || 0;
    return !deletedAt || deletedAt < updatedAt;
  });
  localStorage.setItem(storageKey(STORAGE_HISTORY), JSON.stringify(merged));
  if (currentPage === "history") renderHistory();
  else render();
}

function scheduleRemoteHistoryApply() {
  clearTimeout(accountHistoryApplyTimer);
  accountHistoryApplyTimer = setTimeout(() => {
    applyCloudHistory({
      sessions: Object.values(accountRemoteSessions),
      maxHistory: Object.values(accountRemoteMaxHistory)
    });
  }, 60);
}

async function migrateLocalDataToAccount(user) {
  const localProgram = getLocalProgramData() || serializeState();
  const localHistory = loadHistory();
  const cloudHistory = historyToCloudMap(localHistory);
  const accountRef = accountDatabase.ref(`accounts/${user.uid}`);
  await accountRef.set({
    profile: {
      email: user.email,
      createdAt: firebase.database.ServerValue.TIMESTAMP
    },
    program: prepareProgramForCloud({ ...localProgram, updatedAt: Date.now() }),
    sessions: cloudHistory.sessions,
    maxHistory: cloudHistory.maxHistory,
    meta: {
      schemaVersion: 2,
      migratedAt: firebase.database.ServerValue.TIMESTAMP
    }
  });
}

async function initializeAccountData(user) {
  const accountRef = accountDatabase.ref(`accounts/${user.uid}`);
  const snapshot = await accountRef.once("value");
  const cloud = snapshot.val();

  if (!cloud) {
    await migrateLocalDataToAccount(user);
  } else {
    const localProgram = getLocalProgramData();
    const remoteProgram = cloud.program || null;
    if (remoteProgram && (!localProgram || (remoteProgram.updatedAt || 0) > (localProgram.updatedAt || 0))) {
      applyCloudProgram(remoteProgram);
    } else if (localProgram) {
      await accountRef.child("program").set(prepareProgramForCloud(localProgram));
    }
    accountRemoteTombstones = cloud.sessionTombstones || {};
    accountHistoryClearedAt = cloud.meta?.historyClearedAt || 0;
    const mergedHistory = mergeHistory(loadHistory(), cloudMapToHistory(cloud));
    mergedHistory.sessions = mergedHistory.sessions.filter(session => {
      const updatedAt = session.updatedAt || 0;
      if (accountHistoryClearedAt && updatedAt <= accountHistoryClearedAt) return false;
      const deletedAt = accountRemoteTombstones[accountSessionKey(session)] || 0;
      return !deletedAt || deletedAt < updatedAt;
    });
    localStorage.setItem(storageKey(STORAGE_HISTORY), JSON.stringify(mergedHistory));
    await replaceAccountHistory(mergedHistory);
    if (!cloud.meta?.migratedAt) {
      await accountRef.update({
        "profile/email": user.email,
        "meta/schemaVersion": 2,
        "meta/migratedAt": firebase.database.ServerValue.TIMESTAMP
      });
    }
  }

  accountListeners.forEach(ref => ref.off());
  accountListeners = [];

  const programRef = accountRef.child("program");
  programRef.on("value", snap => {
    const remote = snap.val();
    const local = getLocalProgramData();
    if (remote && (remote.updatedAt || 0) > (local?.updatedAt || 0)) {
      applyCloudProgram(remote);
    }
  });
  accountListeners.push(programRef);

  const sessionsRef = accountRef.child("sessions");
  sessionsRef.on("child_added", snap => {
    accountRemoteSessions[snap.key] = snap.val();
    scheduleRemoteHistoryApply();
  });
  sessionsRef.on("child_changed", snap => {
    accountRemoteSessions[snap.key] = snap.val();
    scheduleRemoteHistoryApply();
  });
  sessionsRef.on("child_removed", snap => {
    delete accountRemoteSessions[snap.key];
    scheduleRemoteHistoryApply();
  });
  accountListeners.push(sessionsRef);

  const maxHistoryRef = accountRef.child("maxHistory");
  maxHistoryRef.on("value", snap => {
    accountRemoteMaxHistory = snap.val() || {};
    applyCloudHistory({ sessions: Object.values(accountRemoteSessions), maxHistory: Object.values(accountRemoteMaxHistory) });
  });
  accountListeners.push(maxHistoryRef);

  const tombstonesRef = accountRef.child("sessionTombstones");
  tombstonesRef.on("value", snap => {
    accountRemoteTombstones = snap.val() || {};
    applyCloudHistory({ sessions: Object.values(accountRemoteSessions), maxHistory: Object.values(accountRemoteMaxHistory) });
  });
  accountListeners.push(tombstonesRef);

  const clearedAtRef = accountRef.child("meta/historyClearedAt");
  clearedAtRef.on("value", snap => {
    accountHistoryClearedAt = snap.val() || 0;
    applyCloudHistory({ sessions: Object.values(accountRemoteSessions), maxHistory: Object.values(accountRemoteMaxHistory) });
  });
  accountListeners.push(clearedAtRef);
}

function scheduleAccountProgramSync(data) {
  if (!accountUser || !accountDatabase || accountApplyingRemote) return;
  clearTimeout(accountProgramTimer);
  setSyncStatus(navigator.onLine === false ? "offline" : "saving");
  accountProgramTimer = setTimeout(() => {
    accountDatabase.ref(`accounts/${accountUser.uid}/program`).set(prepareProgramForCloud(data))
      .then(() => setSyncStatus("saved"))
      .catch(() => setSyncStatus(navigator.onLine === false ? "offline" : "error"));
  }, 400);
}

async function syncAccountHistory(history) {
  if (!accountUser || !accountDatabase) return;
  setSyncStatus("saving");
  const maps = historyToCloudMap(history);
  const updates = {};
  Object.entries(maps.sessions).forEach(([key, value]) => {
    updates[`sessions/${key}`] = value;
  });
  Object.entries(maps.maxHistory).forEach(([key, value]) => {
    updates[`maxHistory/${key}`] = value;
  });
  updates["profile/lastSyncAt"] = firebase.database.ServerValue.TIMESTAMP;
  await accountDatabase.ref(`accounts/${accountUser.uid}`).update(updates);
  setSyncStatus("saved");
}

async function replaceAccountHistory(history, options = {}) {
  if (!accountUser || !accountDatabase) return;
  setSyncStatus("saving");
  const maps = historyToCloudMap(history);
  const accountRef = accountDatabase.ref(`accounts/${accountUser.uid}`);
  const writes = [
    accountRef.child("sessions").set(maps.sessions),
    accountRef.child("maxHistory").set(maps.maxHistory),
    accountRef.child("profile/lastSyncAt").set(firebase.database.ServerValue.TIMESTAMP)
  ];
  if (options.resetDeletionMarkers) {
    accountRemoteTombstones = {};
    accountHistoryClearedAt = 0;
    writes.push(accountRef.child("sessionTombstones").remove());
    writes.push(accountRef.child("meta/historyClearedAt").remove());
  }
  await Promise.all(writes);
  setSyncStatus("saved");
}

function syncAccountSession(session) {
  if (!accountUser || !accountDatabase || !session) return Promise.resolve();
  const key = accountSessionKey(session);
  setSyncStatus("saving");
  return accountDatabase.ref(`accounts/${accountUser.uid}`).update({
    [`sessions/${key}`]: session,
    [`sessionTombstones/${key}`]: null,
    "profile/lastSyncAt": firebase.database.ServerValue.TIMESTAMP
  }).then(() => setSyncStatus("saved"))
    .catch(() => setSyncStatus(navigator.onLine === false ? "offline" : "error"));
}

function deleteAccountSession(session) {
  if (!accountUser || !accountDatabase || !session) return;
  const key = accountSessionKey(session);
  const deletedAt = Date.now();
  accountDatabase.ref(`accounts/${accountUser.uid}`).update({
    [`sessions/${key}`]: null,
    [`sessionTombstones/${key}`]: deletedAt
  }).catch(() => setSyncStatus(navigator.onLine === false ? "offline" : "error"));
}

function clearAccountHistory() {
  if (!accountUser || !accountDatabase) return;
  const clearedAt = Date.now();
  accountHistoryClearedAt = clearedAt;
  accountDatabase.ref(`accounts/${accountUser.uid}`).update({
    sessions: null,
    maxHistory: null,
    sessionTombstones: null,
    "meta/historyClearedAt": clearedAt
  }).catch(() => setSyncStatus(navigator.onLine === false ? "offline" : "error"));
}

function initAccountSystem() {
  if (!window.firebase) {
    setWelcomeMessage("Service de connexion indisponible. Vérifie ta connexion.");
    return;
  }
  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  accountAuth = firebase.auth();
  accountDatabase = firebase.database();
  accountAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
  accountAuth.onAuthStateChanged(async user => {
    accountListeners.forEach(ref => ref.off());
    accountListeners = [];
    accountRemoteSessions = {};
    accountRemoteMaxHistory = {};
    accountRemoteTombstones = {};
    accountHistoryClearedAt = 0;
    accountUser = user;
    updateAccountModal();
    if (!user) {
      activateAccountStorage(null);
      resetStateToDefaults();
      render();
      setSyncStatus("offline", "Déconnecté");
      document.getElementById("loginOverlay").style.display = "flex";
      return;
    }
    activateAccountStorage(user.uid);
    const hasLocalProgram = localStorage.getItem(storageKey(STORAGE_PROGRAM)) !== null;
    loadState();
    restoreLocalTimerState();
    if (!hasLocalProgram) saveState({ sync: false });
    render();
    document.getElementById("loginOverlay").style.display = "none";
    document.getElementById("welcomePassword").value = "";
    setWelcomeMessage("");
    setAccountMessage("Synchronisation...", "");
    setSyncStatus("saving");
    try {
      await initializeAccountData(user);
      setAccountMessage("Synchronisation active.", "success");
      setSyncStatus("saved");
    } catch(error) {
      setAccountMessage("Synchronisation impossible. Les données locales sont conservées.", "error");
      setSyncStatus(navigator.onLine === false ? "offline" : "error");
    }
  });
}

function getMax(ref) {
  if (ref === "squat") return state.maxSquat;
  if (ref === "bench") return state.maxBench;
  if (ref === "deadlift") return state.maxDeadlift;
  return null;
}

function calcWeight(pct, ref) {
  const max = getMax(ref);
  if (!max || !pct) return null;
  return Math.round((max * pct / 100) / 2.5) * 2.5;
}

function buildAccessoryCatalog() {
  const byId = new Map();
  PROGRAM.forEach(wave => wave.days.forEach(day => {
    (day.exercises || []).forEach(ex => {
      if (ex.ref) return;
      const id = ex.id || ACCESSORY_IDS[ex.name];
      if (!id) return;
      const candidate = {
        id,
        name: ex.name,
        range: ex.range || ACC_RANGES[ex.name] || "6-10",
        sets: ex.sets.map(group => ({ ...group }))
      };
      const current = byId.get(id);
      if (!current || expandSets(candidate).length > expandSets(current).length) {
        byId.set(id, candidate);
      }
    });
  }));
  return Array.from(byId.values()).sort((a, b) => a.name.localeCompare(b.name, "fr"));
}

function expandSets(exercise) {
  const expanded = [];
  exercise.sets.forEach((group, gi) => {
    for (let i = 0; i < group.s; i++) {
      expanded.push({ ...group, groupIndex: gi, setIndex: i, ref: exercise.ref });
    }
  });
  return expanded;
}

function getExerciseSets(exercise) {
  const sets = expandSets(exercise);
  if (!exercise.preFatigue) return sets;
  const selected = state.preFatigueSets[exercise.id] || 1;
  return sets.slice(0, selected);
}

function setPreFatigueSetCount(exerciseId, count) {
  const wasComplete = getDayProgress(state.week, state.day).pct === 100;
  state.preFatigueSets[exerciseId] = count === 2 ? 2 : 1;
  if (count === 1) {
    PROGRAM[0].days.forEach((day, dayIndex) => {
      const exerciseIndex = (day.exercises || []).findIndex(ex => ex.id === exerciseId);
      if (exerciseIndex >= 0) {
        delete state.completions[setKey(0, dayIndex, String(exerciseIndex), 1)];
      }
    });
  }
  saveState();
  render();
  afterSessionChange(state.week, state.day, wasComplete);
}

function sessionOccurrenceKey(cycle = state.cycle, week = state.week, day = state.day, runId = state.runId) {
  const base = `c${cycle}w${week}s${day}`;
  return !runId || runId === INITIAL_RUN_ID ? base : `r${runId}:${base}`;
}

function isLegacyWeeklySession(session) {
  if (!session || session.programId) return false;
  const day = PROGRAM[session.week]?.days?.[session.day];
  return session.weekName === PROGRAM[session.week]?.name && (!session.dayName || session.dayName === day?.name);
}

function effectiveSessionProgramId(session) {
  if (session?.programId) return session.programId;
  return isLegacyWeeklySession(session) ? PROGRAM_ID : "legacy-sbd";
}

function effectiveSessionRunId(session) {
  return session?.runId || INITIAL_RUN_ID;
}

function sessionMatchesContext(session, week, day, cycle = state.cycle, runId = state.runId) {
  return effectiveSessionProgramId(session) === PROGRAM_ID
    && effectiveSessionRunId(session) === (runId || INITIAL_RUN_ID)
    && session.week === week
    && session.day === day
    && (session.cycle || 1) === cycle;
}

function getExtraAccessoryIds(week = state.week, day = state.day) {
  return (state.extraAccessories[sessionOccurrenceKey(state.cycle, week, day)] || [])
    .map(normalizeAccessoryId);
}

function getSessionExercises(week = state.week, day = state.day) {
  const base = PROGRAM[week].days[day].exercises || [];
  const occurrence = sessionOccurrenceKey(state.cycle, week, day);
  const freestyleSelection = state.freestyleSelections[occurrence];
  const freestyleTemplate = freestyleSelection ? FREESTYLE_BY_ID[freestyleSelection.id] : null;
  const freestyle = freestyleTemplate ? [{
    ...freestyleTemplate,
    sets: [{ ...freestyleTemplate.sets[0], s: freestyleSelection.sets || 3 }]
  }] : [];
  const extras = getExtraAccessoryIds(week, day)
    .map(id => ACCESSORY_BY_ID[id])
    .filter(Boolean)
    .map(ex => ({
      ...ex,
      sets: ex.sets.map(group => ({ ...group })),
      isExtra: true
    }));
  return [...base, ...freestyle, ...extras];
}

function exerciseCompletionKey(exercise, exIdx) {
  if (exercise.isFreestyle) return `f-${exercise.id}`;
  return exercise.isExtra ? `x-${exercise.id}` : String(exIdx);
}

function setKey(week, day, exKey, setIdx) {
  return `w${week}d${day}e${exKey}s${setIdx}`;
}

function localDateKey(date = new Date()) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function isSetDone(week, day, exKey, setIdx) {
  return !!state.completions[setKey(week, day, exKey, setIdx)];
}

function getExerciseSkip(exerciseId, cycle = state.cycle, week = state.week, day = state.day) {
  return state.exerciseSkips[sessionOccurrenceKey(cycle, week, day)]?.[exerciseId] || "";
}

function setExerciseSkip(exerciseId, exKey, reason) {
  const occurrence = sessionOccurrenceKey();
  const previousProgress = getDayProgress(state.week, state.day);
  if (!state.exerciseSkips[occurrence]) state.exerciseSkips[occurrence] = {};
  if (reason) {
    state.exerciseSkips[occurrence][exerciseId] = reason;
    const exercise = getSessionExercises().find((candidate, index) => exerciseCompletionKey(candidate, index) === String(exKey));
    getExerciseSets(exercise || { sets: [] }).forEach((_, index) => {
      delete state.completions[setKey(state.week, state.day, exKey, index)];
    });
  } else {
    delete state.exerciseSkips[occurrence][exerciseId];
    if (!Object.keys(state.exerciseSkips[occurrence]).length) delete state.exerciseSkips[occurrence];
  }
  saveState();
  render();
  afterSessionChange(state.week, state.day, previousProgress.pct === 100);
}

function getExerciseTimerDuration(week, day, exKey) {
  const exercise = getSessionExercises(week, day).find((candidate, index) =>
    exerciseCompletionKey(candidate, index) === String(exKey)
  );
  if (!exercise || exercise.preFatigue) return 0;
  return exercise.rest || 120;
}

function toggleSetDone(week, day, exKey, setIdx) {
  const wasComplete = getDayProgress(week, day).pct === 100;
  const key = setKey(week, day, exKey, setIdx);
  const wasChecked = !!state.completions[key];
  if (wasChecked) {
    delete state.completions[key];
  } else {
    const exercise = getSessionExercises(week, day).find((candidate, index) =>
      exerciseCompletionKey(candidate, index) === String(exKey));
    const exerciseId = exercise?.id || (exercise ? accessoryDataKey(exercise.name) : null);
    const occurrence = sessionOccurrenceKey(state.cycle, week, day);
    if (exerciseId && state.exerciseSkips[occurrence]) {
      delete state.exerciseSkips[occurrence][exerciseId];
      if (!Object.keys(state.exerciseSkips[occurrence]).length) delete state.exerciseSkips[occurrence];
    }
    state.completions[key] = true;
    const duration = getExerciseTimerDuration(week, day, exKey);
    if (duration > 0) startRestTimer(duration);
  }
  saveState();
  render();
  afterSessionChange(week, day, wasComplete);
}

function getDayProgress(week, day) {
  const dayData = PROGRAM[week].days[day];
  if (dayData.rest) return { done: 0, resolved: 0, total: 0, pct: 100, skipped: 0, exercisesStarted: 0, exercisesTotal: 0, exercisePct: 100 };
  let total = 0, done = 0, resolved = 0, skipped = 0, exercisesStarted = 0, exercisesTotal = 0;
  getSessionExercises(week, day).forEach((ex, ei) => {
    const exKey = exerciseCompletionKey(ex, ei);
    const sets = getExerciseSets(ex);
    const exerciseId = ex.id || accessoryDataKey(ex.name);
    const skipReason = getExerciseSkip(exerciseId, state.cycle, week, day);
    total += sets.length;
    if (!ex.preFatigue) exercisesTotal++;
    let exerciseDone = 0;
    sets.forEach((_, si) => {
      if (isSetDone(week, day, exKey, si)) {
        done++;
        exerciseDone++;
      }
    });
    if (skipReason) {
      resolved += sets.length;
      skipped++;
      if (!ex.preFatigue) exercisesStarted++;
    } else {
      resolved += exerciseDone;
      if (!ex.preFatigue && exerciseDone > 0) exercisesStarted++;
    }
  });
  return {
    done,
    resolved,
    total,
    skipped,
    exercisesStarted,
    exercisesTotal,
    pct: total > 0 ? Math.round((resolved / total) * 100) : 0,
    exercisePct: exercisesTotal > 0 ? Math.round((exercisesStarted / exercisesTotal) * 100) : 0
  };
}

function isBlocComplete(blocIndex) {
  const bloc = PROGRAM[blocIndex];
  const history = loadHistory();
  for (let di = 0; di < bloc.days.length; di++) {
    if (bloc.days[di].rest) continue;
    if (!isSessionValidated(blocIndex, di, state.cycle, history)) return false;
  }
  return true;
}

function getLatestExercisePerformance(exerciseName) {
  const exerciseId = ACCESSORY_IDS[exerciseName];
  const validIds = equivalentAccessoryIds(exerciseId);
  const sessions = loadHistory().sessions || [];
  for (let i = sessions.length - 1; i >= 0; i--) {
    const exercise = (sessions[i].exercises || []).find(ex =>
      (exerciseId && validIds.includes(ex.id)) || ex.name === exerciseName);
    if (!exercise) continue;
    const completed = (exercise.sets || []).filter(set => set.done);
    if (!completed.length) continue;
    const reps = completed.map(set => set.reps === "AMRAP" ? "MAX" : set.reps).join(" / ");
    const weights = [...new Set(completed.map(set => set.weight).filter(weight => weight !== null && weight !== undefined))];
    const weightText = weights.length ? `${weights.join(" / ")} kg · ` : "";
    return `${weightText}${reps} reps · ${sessions[i].date}`;
  }
  return "Aucune performance enregistrée";
}

function openAccessoryPicker() {
  document.getElementById("accessoryPickerTitle").textContent = "Ajouter un accessoire";
  document.getElementById("accessoryPickerSubtitle").textContent = "Ajouté uniquement à cette séance.";
  const currentExercises = getSessionExercises().map(ex => ex.id || ACCESSORY_IDS[ex.name]).filter(Boolean);
  const list = document.getElementById("accessoryPickerList");
  list.innerHTML = ACCESSORY_CATALOG.map(ex => {
    const alreadyPresent = currentExercises.includes(ex.id);
    const summary = alreadyPresent ? "Déjà présent dans cette séance" : getLatestExercisePerformance(ex.name);
    return `<button class="accessory-picker-item" ${alreadyPresent ? "disabled" : ""} onclick="addExtraAccessory('${ex.id}')">`
      + `<span class="accessory-picker-name">${escHtml(ex.name)}</span>`
      + `<span class="accessory-picker-meta">${escHtml(ex.range)} · ${escHtml(summary)}</span>`
      + `</button>`;
  }).join("");
  document.getElementById("accessoryPickerModal").classList.add("show");
}

function openFreestylePicker() {
  document.getElementById("accessoryPickerTitle").textContent = "Exercice libre jambes";
  document.getElementById("accessoryPickerSubtitle").textContent = "Choisis selon tes envies et tes besoins du jour.";
  document.getElementById("accessoryPickerList").innerHTML = FREESTYLE_CATALOG.map(ex => {
    const summary = getLatestExercisePerformance(ex.name);
    return `<button class="accessory-picker-item" onclick="selectFreestyleExercise('${ex.id}')">`
      + `<span class="accessory-picker-name">${escHtml(ex.name)}</span>`
      + `<span class="accessory-picker-meta">${escHtml(summary)}</span>`
      + `</button>`;
  }).join("");
  document.getElementById("accessoryPickerModal").classList.add("show");
}

function selectFreestyleExercise(exerciseId) {
  if (!FREESTYLE_BY_ID[exerciseId]) return;
  state.freestyleSelections[sessionOccurrenceKey()] = { id: exerciseId, sets: 3 };
  saveState();
  closeAccessoryPicker();
  render();
}

function changeFreestyleSetCount(delta) {
  const wasComplete = getDayProgress(state.week, state.day).pct === 100;
  const occurrence = sessionOccurrenceKey();
  const selection = state.freestyleSelections[occurrence];
  if (!selection) return;
  const previous = selection.sets || 3;
  const next = Math.max(1, Math.min(8, previous + delta));
  selection.sets = next;
  if (next < previous) {
    for (let index = next; index < previous; index++) {
      delete state.completions[setKey(state.week, state.day, `f-${selection.id}`, index)];
    }
  }
  saveState();
  render();
  afterSessionChange(state.week, state.day, wasComplete);
}

function removeFreestyleExercise() {
  const wasComplete = getDayProgress(state.week, state.day).pct === 100;
  const occurrence = sessionOccurrenceKey();
  const selection = state.freestyleSelections[occurrence];
  if (!selection) return;
  const count = selection.sets || 3;
  const hasCompletedSet = Array.from({ length: count }, (_, index) => index)
    .some(index => isSetDone(state.week, state.day, `f-${selection.id}`, index));
  if (hasCompletedSet && !confirm("Retirer cet exercice libre et ses séries de la séance ?")) return;
  for (let index = 0; index < count; index++) {
    delete state.completions[setKey(state.week, state.day, `f-${selection.id}`, index)];
  }
  delete state.freestyleSelections[occurrence];
  saveState();
  render();
  afterSessionChange(state.week, state.day, wasComplete);
}

function closeAccessoryPicker() {
  document.getElementById("accessoryPickerModal").classList.remove("show");
}

function addExtraAccessory(accessoryId) {
  if (!ACCESSORY_BY_ID[accessoryId]) return;
  const key = sessionOccurrenceKey();
  const ids = state.extraAccessories[key] || [];
  if (!ids.includes(accessoryId)) ids.push(accessoryId);
  state.extraAccessories[key] = ids;
  saveState();
  closeAccessoryPicker();
  render();
}

function removeExtraAccessory(accessoryId) {
  const exercise = ACCESSORY_BY_ID[accessoryId];
  if (!exercise) return;
  const loggedSession = loadHistory().sessions.find(session =>
    sessionMatchesContext(session, state.week, state.day));
  const isSavedInHistory = (loggedSession?.exercises || []).some(ex =>
    ex.source === "added" && (ex.id === accessoryId || ex.name === exercise.name));
  if (isSavedInHistory) {
    alert("Cette séance est déjà enregistrée. Dévalide-la avant de retirer un accessoire.");
    return;
  }
  const exKey = `x-${accessoryId}`;
  const hasCompletedSet = expandSets(exercise).some((_, si) =>
    isSetDone(state.week, state.day, exKey, si));
  if (hasCompletedSet && !confirm(`Retirer ${exercise.name} de cette séance ? Ses séries non validées ne seront pas enregistrées dans l'historique.`)) {
    return;
  }
  const occurrence = sessionOccurrenceKey();
  state.extraAccessories[occurrence] = (state.extraAccessories[occurrence] || [])
    .filter(id => id !== accessoryId);
  if (!state.extraAccessories[occurrence].length) delete state.extraAccessories[occurrence];
  expandSets(exercise).forEach((_, si) => {
    delete state.completions[setKey(state.week, state.day, exKey, si)];
  });
  saveState();
  render();
}

function renderNav() {
  const nav = document.getElementById('nav');
  let html = '<div class="nav-section weekly-nav">';
  PROGRAM[state.week].days.forEach((d, di) => {
    const active = di === state.day ? 'active' : '';
    const check = (!d.rest && isSessionValidated(state.week, di)) ? ' &#10003;' : '';
    html += `<button class="nav-tab ${active}${d.rest ? ' rest' : ''}" onclick="selectDay(${di})" ${active ? 'aria-current="page"' : ''}>J${di + 1} · ${d.shortName}${check}</button>`;
  });
  html += '</div>';
  nav.innerHTML = html;
}

const RATING_LABELS = { easy: 'Très facile', right: 'Adapté', hard: 'Très difficile' };
const SKIP_LABELS = { injury: 'Blessure / douleur', time: 'Manque de temps', equipment: 'Matériel indisponible', choice: 'Choix du jour' };

function renderWeekAdvanceBanner() {
  if (!isBlocComplete(0)) return '';
  return `
    <div class="week-complete-banner">
      <div><strong>Semaine ${state.cycle} terminée</strong><span>Les quatre entraînements ont été validés.</span></div>
      <button onclick="advanceCycle()">Commencer la semaine ${state.cycle + 1}</button>
    </div>`;
}

function getRecentExerciseHistory(exercise, history, limit = 3) {
  const exerciseId = exercise.id || accessoryDataKey(exercise.name);
  const results = [];
  const sessions = (history?.sessions || []).slice().reverse();
  for (const session of sessions) {
    const isCurrentSession = sessionMatchesContext(session, state.week, state.day);
    if (isCurrentSession) continue;
    const match = (session.exercises || []).find(item =>
      (item.id && normalizeAccessoryId(item.id) === normalizeAccessoryId(exerciseId)) ||
      (!item.id && item.name === exercise.name)
    );
    if (!match) continue;
    results.push({ session, exercise: match });
    if (results.length >= limit) break;
  }
  return results;
}

function formatPreviousSets(sets) {
  const completed = (sets || []).filter(set => set.done);
  if (completed.length === 0) return 'Aucune série validée';
  return completed.map(set => {
    const reps = set.reps === 'AMRAP' ? 'AMRAP' : `${set.reps ?? '—'}`;
    return set.weight !== null && set.weight !== undefined ? `${reps}×${set.weight} kg` : reps;
  }).join(' · ');
}

function renderRecentExerciseHistory(exercise, history) {
  const recent = getRecentExerciseHistory(exercise, history);
  if (recent.length === 0) return '';
  let html = '<div class="recent-exercise-history"><div class="recent-exercise-title">3 dernières séances</div>';
  recent.forEach(item => {
    const rating = RATING_LABELS[item.exercise.rating] ? item.exercise.rating : '';
    const performance = item.exercise.skipped
      ? `Ignoré · ${SKIP_LABELS[item.exercise.skipReason] || item.exercise.skipReason || 'Non précisé'}`
      : formatPreviousSets(item.exercise.sets);
    html += `<div class="recent-exercise-row"><span class="recent-exercise-date">${escHtml(formatHistoryDate(item.session.date))}</span>`;
    html += `<span class="recent-exercise-sets">${escHtml(performance)}</span>`;
    html += rating ? `<span class="recent-exercise-rating ${rating}">${RATING_LABELS[rating] || rating}</span>` : '<span></span>';
    html += '</div>';
  });
  return html + '</div>';
}

function renderContent() {
  const content = document.getElementById('content');
  const dayData = PROGRAM[state.week].days[state.day];

  if (dayData.rest) {
    content.innerHTML = `
      <div class="rest-day">
        <div class="icon">&#128564;</div>
        <h2>Repos</h2>
        <p>Récupère bien. Mange. Dors. Reviens plus fort.</p>
      </div>${renderWeekAdvanceBanner()}`;
    return;
  }

  const history = loadHistory();

  const prog = getDayProgress(state.week, state.day);
  let html = `
    <div class="day-header">
      <h2>${dayData.name}</h2>
      <p>Jour ${state.day + 1}/7 · Semaine ${state.cycle}</p>
      <div class="day-progress">
        <div class="progress-bar"><div class="progress-fill" style="width:${prog.exercisePct}%"></div></div>
        <span class="progress-text">${prog.exercisesStarted}/${prog.exercisesTotal} exos</span>
      </div>
    </div>${renderWeekAdvanceBanner()}`;

  const sessionExercises = getSessionExercises(state.week, state.day);
  let currentSection = "";
  let workIndex = 0;
  sessionExercises.forEach((ex, ei) => {
    const section = ex.preFatigue ? "Pré-fatigue" : ex.isFreestyle ? "Freestyle jambes" : "Exercices";
    if (section !== currentSection) {
      html += `<div class="workout-section-title"><span>${section}</span></div>`;
      currentSection = section;
    }
    const exKey = exerciseCompletionKey(ex, ei);
    const sets = getExerciseSets(ex);
    const exerciseId = ex.id || accessoryDataKey(ex.name);
    const skipReason = getExerciseSkip(exerciseId);
    const allDone = !skipReason && sets.every((_, si) => isSetDone(state.week, state.day, exKey, si));
    const cardClass = skipReason ? 'exercise-card skipped' : allDone ? 'exercise-card completed' : 'exercise-card';

    const tag = ex.preFatigue ? "P" : ex.isFreestyle ? "F" : ex.isExtra ? "+" : String(++workIndex);
    html += `<div class="${cardClass}${ex.isExtra ? ' extra-accessory' : ''}${ex.preFatigue ? ' pre-fatigue-card' : ''}${ex.isFreestyle ? ' freestyle-card' : ''}">`;
    html += `<div class="exercise-header">`;
    html += `<div class="exercise-tag">${tag}</div>`;
    html += `<div class="exercise-title"><div class="exercise-name">${ex.name}</div>`;
    html += `<div class="exercise-meta">${ex.tempo ? `<span>${ex.tempo}</span>` : ''}${ex.rpe ? `<span>RPE ${ex.rpe}</span>` : ''}${ex.rest ? `<span>${ex.rest / 60} min repos</span>` : ''}</div>`;
    html += ex.instructions ? `<div class="exercise-instructions">${ex.instructions}</div>` : '';
    html += `</div>`;
    if (ex.preFatigue) {
      const selectedSets = state.preFatigueSets[ex.id] || 1;
      html += `<div class="set-choice" onclick="event.stopPropagation()"><button class="${selectedSets === 1 ? 'active' : ''}" aria-label="Une série pour ${escAttr(ex.name)}" aria-pressed="${selectedSets === 1}" onclick="setPreFatigueSetCount('${ex.id}',1)">1</button><button class="${selectedSets === 2 ? 'active' : ''}" aria-label="Deux séries pour ${escAttr(ex.name)}" aria-pressed="${selectedSets === 2}" onclick="setPreFatigueSetCount('${ex.id}',2)">2</button></div>`;
    }
    if (ex.isFreestyle) {
      html += `<div class="freestyle-controls" onclick="event.stopPropagation()"><button onclick="changeFreestyleSetCount(-1)" aria-label="Retirer une série">−</button><span>${sets.length} séries</span><button onclick="changeFreestyleSetCount(1)" aria-label="Ajouter une série">+</button><button onclick="openFreestylePicker()" aria-label="Changer d'exercice">↻</button><button onclick="removeFreestyleExercise()" aria-label="Retirer l'exercice">×</button></div>`;
    }
    if (ex.isExtra) {
      html += `<button class="remove-extra-btn" onclick="event.stopPropagation();removeExtraAccessory('${ex.id}')" title="Retirer de cette séance" aria-label="Retirer ${escAttr(ex.name)}">&times;</button>`;
    }
    if (!ex.preFatigue) {
      html += `<select class="skip-select${skipReason ? ' active' : ''}" aria-label="Statut de ${escAttr(ex.name)}" onclick="event.stopPropagation()" onchange="setExerciseSkip('${escAttr(exerciseId)}','${escAttr(exKey)}',this.value)">`;
      html += `<option value="">À faire</option>`;
      Object.entries(SKIP_LABELS).forEach(([value, label]) => {
        html += `<option value="${value}"${skipReason === value ? ' selected' : ''}>${label}</option>`;
      });
      html += `</select>`;
    }
    html += `<div class="exercise-check" aria-hidden="true">${skipReason ? '&#8212;' : allDone ? '&#10003;' : ''}</div>`;
    html += `</div>`;
    html += `<div class="sets-container">`;

    // Accessory free-text note (réglage siège, cues…) — entre le titre et les séries
    if (!ex.ref) {
      const note = getCustomNote(ex.name);
      const exNameEsc = ex.name.replace(/"/g, '&quot;');
      html += `<div class="acc-note-row"><input type="text" class="acc-note-input${note ? '' : ' empty'}" aria-label="Note, ${escAttr(ex.name)}" placeholder="&#128221; Note (ex. r&eacute;glage si&egrave;ge, prise, cran&hellip;)" value="${escAttr(note)}" data-exname="${exNameEsc}" onclick="event.stopPropagation()" onchange="onNoteInputChange(this)"></div>`;
    }

    if (!ex.preFatigue) {
      html += renderRecentExerciseHistory(ex, history);
    }

    sets.forEach((set, si) => {
      const done = isSetDone(state.week, state.day, exKey, si);
      const rowClass = done ? 'set-row done' : 'set-row';
      const checkClass = done ? 'set-checkbox checked' : 'set-checkbox';

      // Build set info
      let info = '';

      if (set.pct !== undefined && set.ref) {
        // PR-based exercise: fixed reps + calculated weight
        info += '<span class="reps">';
        if (set.r === "AMRAP") {
          info += `1 rep</span><span class="amrap-badge">AMRAP</span>`;
        } else {
          info += `${set.r} rep${set.r > 1 ? 's' : ''}</span>`;
        }
        const kg = calcWeight(set.pct, set.ref);
        if (kg !== null) {
          const actualPct = Math.round(kg / getMax(set.ref) * 100);
          info += `<span class="weight">${kg} kg</span>`;
          info += `<span class="pct">(${actualPct}%)</span>`;
        }
      } else if (!set.ref) {
        // Accessory exercise: editable reps + editable weight (double progression)
        const exNameEsc = ex.name.replace(/"/g, '&quot;');
        const programReps = set.r === "AMRAP" || set.r === "MAX" ? "MAX" : set.r;

        // Reps input (independent per set — keyed by absolute set index si)
        const cr = getCustomReps(ex.name, si);
        const repsVal = (cr !== null) ? cr : '';
        const repsEmpty = (cr === null) ? ' empty' : '';
        info += `<input type="number" step="1" inputmode="numeric" class="acc-input reps-input${repsEmpty}" aria-label="Répétitions, ${escAttr(ex.name)}, série ${si + 1}" placeholder="${programReps}" value="${repsVal}" data-exname="${exNameEsc}" data-set="${si}" data-ekey="${exKey}" onclick="event.stopPropagation()" onchange="onRepsInputChange(this)"${skipReason ? ' disabled' : ''}>`;
        info += `<span class="acc-unit">${ex.tracking === "time" ? "sec" : "reps"}</span>`;

        info += `<span class="acc-x">&times;</span>`;

        // Weight input
        const cw = getCustomWeight(ex.name, si);
        const weightVal = (cw !== null) ? cw : '';
        const weightEmpty = (cw === null) ? ' empty' : '';
        info += `<input type="number" step="0.5" inputmode="decimal" class="acc-input weight-input${weightEmpty}" aria-label="Poids, ${escAttr(ex.name)}, série ${si + 1}" placeholder="—" value="${weightVal}" data-exname="${exNameEsc}" data-set="${si}" onclick="event.stopPropagation()" oninput="onWeightInputChange(this)"${skipReason ? ' disabled' : ''}>`;
        info += `<span class="acc-unit">kg</span>`;
      } else {
        // Fallback (shouldn't happen): just show reps
        info += '<span class="reps">';
        if (set.r === "AMRAP") {
          info += `1 rep</span><span class="amrap-badge">AMRAP</span>`;
        } else {
          info += `${set.r} rep${set.r > 1 ? 's' : ''}</span>`;
        }
      }

      if (set.rpe !== undefined) {
        info += `<span class="rpe">RPE ${set.rpe}</span>`;
      }

      // Accessory range label (right-aligned)
      const range = (!set.ref && !ex.ref) ? (ex.range || ACC_RANGES[ex.name]) : null;
      if (range) {
        info += `<span class="acc-range">${range}</span>`;
      }

      html += `<div class="${rowClass}">`;
      html += `<button type="button" class="${checkClass}" aria-label="${done ? 'Décocher' : 'Cocher'} ${escAttr(ex.name)}, série ${si + 1}" aria-pressed="${done}" onclick="toggleSetDone(${state.week},${state.day},'${exKey}',${si})"${skipReason ? ' disabled' : ''}>&#10003;</button>`;
      html += `<div class="set-info">${info}</div>`;
      html += `</div>`;
    });

    if (!ex.preFatigue && !skipReason) {
      const rating = getExerciseRating(ex.id || accessoryDataKey(ex.name));
      const ratingId = escAttr(ex.id || accessoryDataKey(ex.name));
      html += `<div class="effort-rating"><span class="effort-rating-label">Ressenti du bloc</span>`;
      html += `<button class="easy${rating === 'easy' ? ' active' : ''}" aria-label="${escAttr(ex.name)} : très facile" aria-pressed="${rating === 'easy'}" onclick="setExerciseRating('${ratingId}','easy')">Très facile</button>`;
      html += `<button class="right${rating === 'right' ? ' active' : ''}" aria-label="${escAttr(ex.name)} : adapté" aria-pressed="${rating === 'right'}" onclick="setExerciseRating('${ratingId}','right')">Adapté</button>`;
      html += `<button class="hard${rating === 'hard' ? ' active' : ''}" aria-label="${escAttr(ex.name)} : très difficile" aria-pressed="${rating === 'hard'}" onclick="setExerciseRating('${ratingId}','hard')">Très difficile</button></div>`;
    }

    html += `</div></div>`;
  });

  if (dayData.freestyle && !state.freestyleSelections[sessionOccurrenceKey()]) {
    html += `<button class="freestyle-picker-btn" onclick="openFreestylePicker()"><span>+</span><strong>Choisir l'exercice libre jambes</strong><small>Squat, presse, deadlift, fentes et autres classiques</small></button>`;
  }

  html += `<button class="add-accessory-btn" onclick="openAccessoryPicker()">`
    + `<span aria-hidden="true">+</span> Ajouter un accessoire</button>`;

  // Session validation footer — valider une séance partielle OU complète vers l'historique
  {
    const sp = getDayProgress(state.week, state.day);
    const logged = isSessionLogged(state.week, state.day);
    if (logged || sp.done > 0 || sp.skipped > 0) {
      html += `<div class="session-validate">`;
      if (logged) {
        html += `<span class="session-validate-ok">&#10003; Séance enregistrée dans l'historique</span>`;
        html += `<button class="btn-devalider" onclick="devalidateSession(${state.week},${state.day})">Dévalider</button>`;
      } else {
        html += `<button class="btn-valider" onclick="showValidateModal(${state.week},${state.day})">Valider la séance</button>`;
      }
      html += `</div>`;
    }
  }

  content.innerHTML = html;
}

function render() {
  document.getElementById('cycleDisplay').textContent = `Semaine ${state.cycle}`;
  renderNav();
  renderContent();
}

function selectDay(d) {
  state.day = d;
  saveState({ sync: false });
  render();
}

function advanceCycle() {
  if (!isBlocComplete(0)) return;
  if (!confirm(`Commencer la semaine ${state.cycle + 1} ? Les séances validées resteront dans l’historique.`)) return;
  storeRecoverySnapshot('advance-week');
  PROGRAM[0].days.forEach((_, dayIndex) => {
    const occurrence = sessionOccurrenceKey(state.cycle, 0, dayIndex);
    delete state.sessionDrafts[occurrence];
    delete state.exerciseRatings[occurrence];
    delete state.exerciseSkips[occurrence];
    delete state.extraAccessories[occurrence];
    delete state.freestyleSelections[occurrence];
  });
  state.cycle++;
  state.completions = {};
  state.week = 0;
  state.day = 0;
  state.freestyleSelections = {};
  saveState();
  render();
}

function resetDay() {
  const dayData = PROGRAM[state.week].days[state.day];
  if (dayData.rest) return;
  const progress = getDayProgress(state.week, state.day);
  if ((progress.done > 0 || progress.skipped > 0 || isSessionLogged(state.week, state.day))
      && !confirm('Réinitialiser cette séance ? Une copie locale de récupération sera créée.')) return;
  storeRecoverySnapshot('reset-session');
  if (isSessionLogged(state.week, state.day)) removeSessionLog(state.week, state.day);
  getSessionExercises(state.week, state.day).forEach((ex, ei) => {
    const exKey = exerciseCompletionKey(ex, ei);
    const sets = getExerciseSets(ex);
    sets.forEach((_, si) => {
      delete state.completions[setKey(state.week, state.day, exKey, si)];
    });
  });
  const occurrence = sessionOccurrenceKey();
  delete state.sessionDrafts[occurrence];
  delete state.exerciseRatings[occurrence];
  delete state.exerciseSkips[occurrence];
  saveState();
  render();
}

// ============================================================
// TIMER
// ============================================================
let timerAudioContext = null;

function saveLocalTimerState() {
  localStorage.setItem(storageKey(STORAGE_TIMER), JSON.stringify({
    duration: state.timerDuration,
    remaining: state.timerRemaining,
    running: state.timerRunning,
    endsAt: state.timerEndsAt
  }));
}

function restoreLocalTimerState() {
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey(STORAGE_TIMER)));
    if (!saved) return;
    state.timerDuration = Number(saved.duration) || 120;
    state.timerEndsAt = saved.running && Number(saved.endsAt) ? Number(saved.endsAt) : null;
    state.timerRemaining = state.timerEndsAt
      ? Math.max(0, Math.ceil((state.timerEndsAt - Date.now()) / 1000))
      : Math.max(0, Number(saved.remaining) || state.timerDuration);
    state.timerRunning = !!state.timerEndsAt && state.timerRemaining > 0;
    state.timerAlarmPlayed = state.timerRemaining === 0;
    if (state.timerRunning) state.timerInterval = setInterval(updateTimerFromClock, 250);
    document.getElementById('timerBtn').textContent = state.timerRunning ? 'Pause' : 'Start';
    updateTimerDisplay();
  } catch(e) {}
}

function unlockTimerAudio() {
  try {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return null;
    if (!timerAudioContext) timerAudioContext = new AudioContextClass();
    if (timerAudioContext.state === 'suspended') timerAudioContext.resume();

    // iOS requires audio to be initialized during a user interaction.
    const oscillator = timerAudioContext.createOscillator();
    const gain = timerAudioContext.createGain();
    oscillator.connect(gain);
    gain.connect(timerAudioContext.destination);
    gain.gain.value = 0;
    oscillator.start();
    oscillator.stop(timerAudioContext.currentTime + 0.01);
    return timerAudioContext;
  } catch(e) {
    return null;
  }
}

function setTimer(seconds) {
  state.timerDuration = seconds;
  state.timerRemaining = seconds;
  clearInterval(state.timerInterval);
  state.timerInterval = null;
  state.timerRunning = false;
  state.timerEndsAt = null;
  state.timerAlarmPlayed = false;
  saveLocalTimerState();
  updateTimerDisplay();
}

function startRestTimer(seconds) {
  setTimer(seconds);
  toggleTimer();
}

function toggleTimer() {
  if (state.timerRunning) {
    updateTimerFromClock();
    clearInterval(state.timerInterval);
    state.timerInterval = null;
    state.timerRunning = false;
    state.timerEndsAt = null;
    document.getElementById('timerBtn').textContent = 'Start';
    saveLocalTimerState();
  } else {
    if (state.timerRemaining <= 0) {
      state.timerRemaining = state.timerDuration;
    }
    unlockTimerAudio();
    state.timerRunning = true;
    state.timerAlarmPlayed = false;
    state.timerEndsAt = Date.now() + state.timerRemaining * 1000;
    document.getElementById('timerBtn').textContent = 'Pause';
    state.timerInterval = setInterval(updateTimerFromClock, 250);
    saveLocalTimerState();
  }
  updateTimerDisplay();
}

function updateTimerFromClock() {
  if (!state.timerRunning || !state.timerEndsAt) return;
  state.timerRemaining = Math.max(0, Math.ceil((state.timerEndsAt - Date.now()) / 1000));
  if (state.timerRemaining === 0) {
    clearInterval(state.timerInterval);
    state.timerInterval = null;
    state.timerRunning = false;
    state.timerEndsAt = null;
    document.getElementById('timerBtn').textContent = 'Start';
    if (!state.timerAlarmPlayed) {
      state.timerAlarmPlayed = true;
      playAlarm();
      if (navigator.vibrate) navigator.vibrate([180, 100, 180]);
    }
    saveLocalTimerState();
  }
  updateTimerDisplay();
}

function resetTimer() {
  clearInterval(state.timerInterval);
  state.timerInterval = null;
  state.timerRunning = false;
  state.timerEndsAt = null;
  state.timerAlarmPlayed = false;
  state.timerRemaining = state.timerDuration;
  document.getElementById('timerBtn').textContent = 'Start';
  saveLocalTimerState();
  updateTimerDisplay();
}

function updateTimerDisplay() {
  const el = document.getElementById('timerDisplay');
  const context = document.getElementById('timerContext');
  const mins = Math.floor(state.timerRemaining / 60);
  const secs = state.timerRemaining % 60;
  el.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
  if (context) context.textContent = 'Repos série';
  el.className = 'timer-display';
  if (state.timerRemaining <= 10 && state.timerRemaining > 0 && state.timerRunning) {
    el.classList.add('warning');
  } else if (state.timerRemaining === 0) {
    el.classList.add('done');
  }
}

function playAlarm() {
  try {
    const ctx = unlockTimerAudio();
    if (!ctx) return;
    [0, 250, 500].forEach(delay => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 880;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.45, ctx.currentTime + delay/1000);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + delay/1000 + 0.2);
      osc.start(ctx.currentTime + delay/1000);
      osc.stop(ctx.currentTime + delay/1000 + 0.2);
    });
  } catch(e) {}
}

async function logout() {

      await accountAuth.signOut();
    } catch(error) {

      return;
    }
  }
