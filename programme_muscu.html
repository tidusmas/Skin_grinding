function buildLocalBackup() {
  let program = null;
  let history = { sessions: [], maxHistory: [] };
  try { program = JSON.parse(localStorage.getItem(storageKey(STORAGE_PROGRAM))); } catch(e) {}
  try { history = JSON.parse(localStorage.getItem(storageKey(STORAGE_HISTORY))) || history; } catch(e) {}
  return {
    schemaVersion: 2,
    application: 'skin-grinding',
    appVersion: APP_VERSION,
    exportedAt: new Date().toISOString(),
    accountEmail: accountUser?.email || null,
    data: { program, history }
  };
}

function storeRecoverySnapshot(reason) {
  const snapshot = buildLocalBackup();
  snapshot.recoveryReason = reason;
  localStorage.setItem(storageKey(STORAGE_RECOVERY), JSON.stringify(snapshot));
}

async function restoreRecoverySnapshot() {
  const raw = localStorage.getItem(storageKey(STORAGE_RECOVERY));
  if (!raw) {
    alert('Aucune sauvegarde de récupération disponible.');
    return;
  }
  if (!confirm('Restaurer l’état enregistré avant le dernier reset ?')) return;
  try {
    const backup = JSON.parse(raw);
    await applyImportedBackup(backup, true);
    localStorage.removeItem(storageKey(STORAGE_RECOVERY));
  } catch(e) {
    alert('La sauvegarde de récupération est illisible.');
  }
}

function validateBackup(backup) {
  if (!backup || backup.application !== 'skin-grinding' || !backup.data) {
    throw new Error('invalid-backup');
  }
  const history = backup.data.history || { sessions: [], maxHistory: [] };
  if (!Array.isArray(history.sessions || []) || !Array.isArray(history.maxHistory || [])) {
    throw new Error('invalid-history');
  }
  return backup;
}

async function applyImportedBackup(input, forceProgramRestore = false) {
  const backup = validateBackup(input);
  storeRecoverySnapshot('before-import');
  const importedHistory = backup.data.history || { sessions: [], maxHistory: [] };
  const mergedHistory = mergeHistory(loadHistory(), importedHistory);
  localStorage.setItem(storageKey(STORAGE_HISTORY), JSON.stringify(mergedHistory));

  const importedProgram = backup.data.program;
  const compatibleProgram = importedProgram?.programVersion === PROGRAM_VERSION;
  const restoreProgram = compatibleProgram && (forceProgramRestore || confirm('Restaurer aussi la progression et les saisies du programme ?'));
  if (restoreProgram) {
    localStorage.setItem(storageKey(STORAGE_PROGRAM), JSON.stringify(importedProgram));
    loadState();
    saveState();
  }
  await replaceAccountHistory(mergedHistory, { resetDeletionMarkers: true }).catch(() => setSyncStatus('error'));
  render();
  if (currentPage === 'history') renderHistory();
  const count = importedHistory.sessions?.length || 0;
  alert(`${count} séance${count > 1 ? 's' : ''} lue${count > 1 ? 's' : ''}. L’historique a été fusionné sans écrasement.`);
}

function requestImportData() {
  document.getElementById('importDataInput').click();
}

async function importLocalData(input) {
  const file = input.files?.[0];
  input.value = '';
  if (!file) return;
  try {
    const backup = JSON.parse(await file.text());
    await applyImportedBackup(backup);
    closeSettings();
  } catch(e) {
    alert('Fichier invalide. Choisis une sauvegarde JSON créée par Skin Grinding.');
  }
}

async function exportLocalData() {
  const backup = buildLocalBackup();
  const json = JSON.stringify(backup, null, 2);
  const date = backup.exportedAt.slice(0, 10);
  const filename = `skin-grinding-backup-${date}.json`;
  const blob = new Blob([json], { type: 'application/json' });
  const file = new File([blob], filename, { type: 'application/json' });

  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({
        files: [file],
        title: 'Sauvegarde Skin Grinding'
      });
    } else {
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }
    const sessionCount = backup.data.history.sessions?.length || 0;
    alert(`Sauvegarde créée : ${sessionCount} séance${sessionCount > 1 ? 's' : ''}.`);
  } catch (error) {
    if (error?.name !== 'AbortError') {
      alert('Impossible de créer la sauvegarde. Réessaie depuis Safari.');
    }
  }
}

function serializeState() {
  return {
    schemaVersion: DATA_SCHEMA_VERSION,
    programVersion: PROGRAM_VERSION,
    programId: PROGRAM_ID,
    runId: state.runId || INITIAL_RUN_ID,
    cycle: state.cycle,
    week: state.week,
    day: state.day,
    completions: state.completions,
    maxSquat: state.maxSquat,
    maxBench: state.maxBench,
    maxDeadlift: state.maxDeadlift,
    customWeights: state.customWeights,
    customReps: state.customReps,
    sessionDrafts: state.sessionDrafts,
    customNotes: state.customNotes,
    exerciseRatings: state.exerciseRatings,
    exercisePain: state.exercisePain,
    personalMedia: state.personalMedia,
    exerciseOverrides: state.exerciseOverrides,
    customSessions: state.customSessions,
    exerciseSkips: state.exerciseSkips,
    weightDataVersion: WEIGHT_DATA_VERSION,
    extraAccessories: state.extraAccessories,
    preFatigueSets: state.preFatigueSets,
    freestyleSelections: state.freestyleSelections,
    historySeedVersion: state.historySeedVersion,
    updatedAt: state.updatedAt,
    timerDuration: state.timerDuration
  };
}

function saveState(options = {}) {
  if (!accountApplyingRemote && options.touch !== false) state.updatedAt = Date.now();
  const data = serializeState();
  localStorage.setItem(storageKey(STORAGE_PROGRAM), JSON.stringify(data));
  if (options.sync !== false) scheduleAccountProgramSync(data);
}

function loadState() {
  resetStateToDefaults();
  try {
    const data = JSON.parse(localStorage.getItem(storageKey(STORAGE_PROGRAM)));
    if (data) {
      if (data.programVersion !== PROGRAM_VERSION) {
        storeRecoverySnapshot('before-program-migration');
        state.updatedAt = Date.now();
        saveState();
        return;
      }
      state.schemaVersion = DATA_SCHEMA_VERSION;
      state.programVersion = PROGRAM_VERSION;
      state.programId = PROGRAM_ID;
      state.runId = data.runId || INITIAL_RUN_ID;
      state.cycle = data.cycle || 1;
      state.week = 0;
      state.day = Math.max(0, Math.min(6, Number(data.day) || 0));
      state.completions = data.completions || {};
      state.maxSquat = data.maxSquat || 110;
      state.maxBench = data.maxBench || 97;
      state.maxDeadlift = data.maxDeadlift || 120;
      state.customWeights = migrateAccessoryKeys(migrateCustomWeights(data.customWeights || {}));
      state.customReps = migrateAccessoryKeys(data.customReps || {});
      state.sessionDrafts = data.sessionDrafts || {};
      state.customNotes = migrateAccessoryKeys(data.customNotes || {});
      state.exerciseRatings = data.exerciseRatings || {};
      state.exercisePain = data.exercisePain || {};
      state.personalMedia = data.personalMedia || {};
      state.exerciseOverrides = data.exerciseOverrides || {};
      state.customSessions = data.customSessions || {};
      state.exerciseSkips = data.exerciseSkips || {};
      const migrateWeights = data.weightDataVersion !== WEIGHT_DATA_VERSION;
      if (migrateWeights) migrateWeightsToIndependentSets();
      state.extraAccessories = migrateExtraAccessories(data.extraAccessories || {});
      state.preFatigueSets = data.preFatigueSets || {};
      state.freestyleSelections = data.freestyleSelections || {};
      state.historySeedVersion = data.historySeedVersion || 0;
      state.updatedAt = data.updatedAt || 0;
      state.timerDuration = data.timerDuration || 120;
      state.timerRemaining = state.timerDuration;
      if (migrateWeights || data.schemaVersion !== DATA_SCHEMA_VERSION || !data.runId) {
        state.updatedAt = Date.now();
        saveState();
      }
    }
  } catch(e) {}
}

// Custom accessory data (keyed by exercise name, stable across cycles/days → auto-pre-fill):
// - state.customWeights[exName][groupIndex] = { w } : weight, shared per set-group.
// - state.customReps[exName][setIndex]      = reps  : INDEPENDENT per individual set.
// - Backward compat: old customWeights format was [number] (weight only), migrated on load.

function accessoryDataKey(exNameOrId) {
  return normalizeAccessoryId(ACCESSORY_IDS[exNameOrId] || exNameOrId);
}

function migrateAccessoryKeys(data) {
  if (!data || typeof data !== 'object') return {};
  Object.keys(data).forEach(oldKey => {
    const stableKey = accessoryDataKey(oldKey);
    if (stableKey !== oldKey) {
      if (data[stableKey] === undefined) data[stableKey] = data[oldKey];
      delete data[oldKey];
    }
  });
  return data;
}

function migrateExtraAccessories(data) {
  if (!data || typeof data !== 'object') return {};
  Object.keys(data).forEach(occurrence => {
    if (!Array.isArray(data[occurrence])) {
      delete data[occurrence];
      return;
    }
    data[occurrence] = [...new Set(data[occurrence].map(normalizeAccessoryId))];
  });
  return data;
}

function _ensureBaselineWeightEntry(exName, setIdx) {
  const key = accessoryDataKey(exName);
  if (!state.customWeights[key]) state.customWeights[key] = [];
  const entry = state.customWeights[key][setIdx];
  if (!entry || typeof entry !== 'object') {
    state.customWeights[key][setIdx] = { w: null, r: null };
  }
  return state.customWeights[key][setIdx];
}

function getSessionDraft(exName, create = false, cycle = state.cycle, week = state.week, day = state.day) {
  const occurrence = sessionOccurrenceKey(cycle, week, day);
  const exerciseKey = accessoryDataKey(exName);
  if (create) {
    if (!state.sessionDrafts[occurrence]) state.sessionDrafts[occurrence] = {};
    if (!state.sessionDrafts[occurrence][exerciseKey]) {
      state.sessionDrafts[occurrence][exerciseKey] = { weights: [], reps: [], rpes: [] };
    }
    if (!state.sessionDrafts[occurrence][exerciseKey].rpes) state.sessionDrafts[occurrence][exerciseKey].rpes = [];
  }
  return state.sessionDrafts[occurrence]?.[exerciseKey] || null;
}

function getCustomWeight(exName, setIdx, cycle = state.cycle, week = state.week, day = state.day, targetWeight = null) {
  const draft = getSessionDraft(exName, false, cycle, week, day);
  if (draft?.weights && Object.prototype.hasOwnProperty.call(draft.weights, setIdx)) {
    const value = draft.weights[setIdx];
    return typeof value === 'number' && !isNaN(value) ? value : null;
  }
  const arr = state.customWeights[accessoryDataKey(exName)];
  if (!arr) return typeof targetWeight === 'number' ? targetWeight : null;
  const entry = arr[setIdx];
  if (typeof entry === 'number') return entry; // legacy format
  if (entry && typeof entry === 'object') {
    const w = entry.w;
    return (typeof w === 'number' && !isNaN(w)) ? w : null;
  }
  return typeof targetWeight === 'number' ? targetWeight : null;
}

function getCustomReps(exName, setIdx, cycle = state.cycle, week = state.week, day = state.day) {
  const draft = getSessionDraft(exName, false, cycle, week, day);
  if (draft?.reps && Object.prototype.hasOwnProperty.call(draft.reps, setIdx)) {
    const value = draft.reps[setIdx];
    return typeof value === 'number' && !isNaN(value) ? value : null;
  }
  const arr = state.customReps[accessoryDataKey(exName)];
  if (!arr) return null;
  const r = arr[setIdx];
  return (typeof r === 'number' && !isNaN(r)) ? r : null;
}

function setCustomWeight(exName, setIdx, weight) {
  const draft = getSessionDraft(exName, true);
  draft.weights[setIdx] = (weight === null || weight === '' || isNaN(weight)) ? null : Number(weight);
  saveState();
}

function getSetRpe(exName, setIdx, cycle = state.cycle, week = state.week, day = state.day) {
  const draft = getSessionDraft(exName, false, cycle, week, day);
  const value = draft?.rpes?.[setIdx];
  return typeof value === 'number' && !isNaN(value) ? value : null;
}

function setSetRpe(exName, setIdx, rpe) {
  const draft = getSessionDraft(exName, true);
  draft.rpes[setIdx] = (rpe === null || rpe === '' || isNaN(rpe)) ? null : Math.max(1, Math.min(10, Number(rpe)));
  saveState();
}

function getExercisePain(exerciseId, cycle = state.cycle, week = state.week, day = state.day) {
  return state.exercisePain[sessionOccurrenceKey(cycle, week, day)]?.[exerciseId] || { score: null, location: '' };
}

function setExercisePain(exerciseId, field, value) {
  const occurrence = sessionOccurrenceKey();
  if (!state.exercisePain[occurrence]) state.exercisePain[occurrence] = {};
  const current = state.exercisePain[occurrence][exerciseId] || { score: null, location: '' };
  if (field === 'score') current.score = value === '' || value === null || isNaN(value) ? null : Math.max(0, Math.min(10, Number(value)));
  if (field === 'location') current.location = String(value || '').trim();
  if (current.score === null && !current.location) delete state.exercisePain[occurrence][exerciseId];
  else state.exercisePain[occurrence][exerciseId] = current;
  if (!Object.keys(state.exercisePain[occurrence]).length) delete state.exercisePain[occurrence];
  saveState();
}

function getPersonalMedia(exerciseId, cycle = state.cycle, week = state.week, day = state.day) {
  return state.personalMedia[sessionOccurrenceKey(cycle, week, day)]?.[exerciseId] || { photoUrl: '', videoUrl: '' };
}

function setPersonalMedia(exerciseId, field, value) {
  const occurrence = sessionOccurrenceKey();
  if (!state.personalMedia[occurrence]) state.personalMedia[occurrence] = {};
  const current = state.personalMedia[occurrence][exerciseId] || { photoUrl: '', videoUrl: '' };
  current[field] = String(value || '').trim();
  if (!current.photoUrl && !current.videoUrl) delete state.personalMedia[occurrence][exerciseId];
  else state.personalMedia[occurrence][exerciseId] = current;
  if (!Object.keys(state.personalMedia[occurrence]).length) delete state.personalMedia[occurrence];
  saveState();
}

function getExerciseRating(exerciseId, cycle = state.cycle, week = state.week, day = state.day) {
  return state.exerciseRatings[sessionOccurrenceKey(cycle, week, day)]?.[exerciseId] || '';
}

function setExerciseRating(exerciseId, rating) {
  if (!['easy', 'right', 'hard'].includes(rating)) return;
  const wasComplete = getDayProgress(state.week, state.day).pct === 100;
  const occurrence = sessionOccurrenceKey();
  if (!state.exerciseRatings[occurrence]) state.exerciseRatings[occurrence] = {};
  state.exerciseRatings[occurrence][exerciseId] = rating;
  saveState();
  render();
  afterSessionChange(state.week, state.day, wasComplete);
}

function setCustomReps(exName, setIdx, reps, persist = true) {
  const draft = getSessionDraft(exName, true);
  draft.reps[setIdx] = (reps === null || reps === '' || isNaN(reps)) ? null : Number(reps);
  if (persist) saveState();
}

function commitExerciseDraft(exName, completedSetIndexes) {
  const draft = getSessionDraft(exName);
  if (!draft) return;
  const key = accessoryDataKey(exName);
  if (!state.customWeights[key]) state.customWeights[key] = [];
  if (!state.customReps[key]) state.customReps[key] = [];
  completedSetIndexes.forEach(setIdx => {
    if (draft.weights && Object.prototype.hasOwnProperty.call(draft.weights, setIdx)) {
      const entry = _ensureBaselineWeightEntry(key, setIdx);
      entry.w = draft.weights[setIdx];
    }
    if (draft.reps && Object.prototype.hasOwnProperty.call(draft.reps, setIdx)) {
      state.customReps[key][setIdx] = draft.reps[setIdx];
    }
  });
}

// Escape a string for safe use inside an HTML attribute value.
function escAttr(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

function escHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function safeExternalUrl(value) {
  const raw = String(value || '').trim();
  if (!raw) return '';
  try {
    const parsed = new URL(raw);
    return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '';
  } catch(e) {
    return '';
  }
}

// Migrate old format [number] → [{w, r}] in place
function migrateCustomWeights(cw) {
  if (!cw || typeof cw !== 'object') return {};
  for (const key in cw) {
    if (Array.isArray(cw[key])) {
      cw[key] = cw[key].map(v => {
        if (v === null || v === undefined) return { w: null, r: null };
        if (typeof v === 'number') return { w: v, r: null };
        if (typeof v === 'object' && v !== null) return v;
        return { w: null, r: null };
      });
    }
  }
  return cw;
}

function migrateWeightsToIndependentSets() {
  Object.keys(state.customWeights).forEach(key => {
    const previous = state.customWeights[key];
    if (!Array.isArray(previous) || previous.length === 0) return;
    const normalized = previous.map(value => {
      if (typeof value === 'number') return { w: value, r: null };
      if (value && typeof value === 'object') return { ...value };
      return { w: null, r: null };
    });
    const last = normalized[normalized.length - 1];
    state.customWeights[key] = Array.from({ length: Math.max(8, normalized.length) }, (_, index) => ({ ...(normalized[index] || last) }));
  });
}

function onRepsInputChange(inputEl) {
  const exName = inputEl.dataset.exname;
  const setIdx = parseInt(inputEl.dataset.set, 10);
  const exKey = inputEl.dataset.ekey;
  const wasComplete = getDayProgress(state.week, state.day).pct === 100;
  const raw = inputEl.value.trim();
  const num = raw === '' ? null : parseInt(raw, 10);
  const key = setKey(state.week, state.day, exKey, setIdx);
  const wasSetDone = !!state.completions[key];
  setCustomReps(exName, setIdx, num, false); // independent per set — no sibling sync
  // Saisir des reps coche la série (= validée) ; vider la case la décoche.
  if (num !== null) {
    state.completions[key] = true;
    const exercise = getSessionExercises().find((candidate, index) => exerciseCompletionKey(candidate, index) === String(exKey));
    const exerciseId = exercise?.id || (exercise ? accessoryDataKey(exercise.name) : null);
    const occurrence = sessionOccurrenceKey();
    if (exerciseId && state.exerciseSkips[occurrence]) {
      delete state.exerciseSkips[occurrence][exerciseId];
      if (!Object.keys(state.exerciseSkips[occurrence]).length) delete state.exerciseSkips[occurrence];
    }
  } else delete state.completions[key];
  if (num !== null && !wasSetDone) {
    const duration = getExerciseTimerDuration(state.week, state.day, exKey);
    if (duration > 0) startRestTimer(duration);
  }
  saveState();
  render();                                // refresh checkbox + running total + signal
  afterSessionChange(state.week, state.day, wasComplete);
}

function closeExerciseEditor() {
  document.getElementById('exerciseEditorModal').classList.remove('show');
  editingExercise = null;
}

function saveExerciseEditor() {
  if (!editingExercise) return;
  const name = document.getElementById('editorExerciseName').value.trim();
  if (!name) {
    document.getElementById('exerciseEditorMessage').textContent = 'Le nom de l’exercice est obligatoire.';
    return;
  }
  const dayIndex = Number(document.getElementById('editorExerciseDay').value);
  const setCount = Math.max(1, Math.min(12, Number(document.getElementById('editorExerciseSets').value) || 1));
  const targetReps = Math.max(0, Number(document.getElementById('editorExerciseReps').value) || 0);
  const targetWeightRaw = document.getElementById('editorExerciseWeight').value.trim();
  const targetWeight = targetWeightRaw === '' ? null : Math.max(0, Number(targetWeightRaw));
  const restRaw = document.getElementById('editorExerciseRest').value.trim();
  const rest = restRaw === '' ? null : Math.max(0, Number(restRaw));
  const tracking = document.getElementById('editorExerciseTracking').value === 'time' ? 'time' : 'reps';
  const videoType = document.getElementById('editorExerciseVideoType').value;
  const videoValue = document.getElementById('editorExerciseVideo').value.trim();
  const media = {
    photo: document.getElementById('editorExercisePhoto').value.trim(),
    video: videoType === 'video' ? videoValue : '',
    reference: videoType === 'reference' ? videoValue : ''
  };
  const payload = {
    name,
    section: document.getElementById('editorExerciseSection').value.trim() || 'Séance principale',
    setCount,
    targetReps,
    tracking,
    repsLabel: document.getElementById('editorExerciseRepsLabel').value.trim() || (tracking === 'time' ? `${targetReps} sec` : String(targetReps)),
    targetWeight,
    targetWeightLabel: document.getElementById('editorExerciseWeightLabel').value.trim() || (targetWeight === null ? 'Non renseignée' : `${targetWeight} kg`),
    weightNote: document.getElementById('editorExerciseWeightNote').value.trim(),
    rest,
    restLabel: document.getElementById('editorExerciseRestLabel').value.trim() || (rest === null ? 'Non renseigné' : rest < 60 ? `${rest} sec` : `${Math.floor(rest / 60)} min${rest % 60 ? ` ${rest % 60}` : ''}`),
    rudyComment: document.getElementById('editorExerciseRudy').value.trim(),
    instructions: document.getElementById('editorExerciseInstructions').value.trim(),
    requiresPersonalVideo: document.getElementById('editorExercisePersonalVideo').checked,
    media,
    dayIndex
  };

  if (editingExercise.isNew) {
    const id = `custom-${createRunId()}`.replace(/[^a-zA-Z0-9-]/g, '-');
    if (!state.customSessions[String(dayIndex)]) {
      state.customSessions[String(dayIndex)] = PROGRAM[state.week].days[dayIndex]?.pending
        ? { name: `Séance libre · Jour ${dayIndex + 1}`, exercises: [] }
        : { exercises: [] };
    }
    state.customSessions[String(dayIndex)].exercises.push({
      id,
      ...payload,
      preFatigue: payload.section.toLocaleLowerCase('fr').includes('isométr'),
      sets: [{ s: setCount, r: targetReps }],
      isCustom: true
    });
  } else {
    const customEntry = Object.entries(state.customSessions).find(([, session]) =>
      (session.exercises || []).some(exercise => exercise.id === editingExercise.exerciseId)
    );
    if (customEntry) {
      const [oldDay, session] = customEntry;
      const existing = session.exercises.find(exercise => exercise.id === editingExercise.exerciseId);
      session.exercises = session.exercises.filter(exercise => exercise.id !== editingExercise.exerciseId);
      if (!state.customSessions[String(dayIndex)]) state.customSessions[String(dayIndex)] = PROGRAM[state.week].days[dayIndex]?.pending
        ? { name: `Séance libre · Jour ${dayIndex + 1}`, exercises: [] }
        : { exercises: [] };
      state.customSessions[String(dayIndex)].exercises.push({
        ...existing,
        ...payload,
        preFatigue: payload.section.toLocaleLowerCase('fr').includes('isométr'),
        sets: [{ s: setCount, r: targetReps }],
        isCustom: true
      });
      if (!session.exercises.length && Number(oldDay) !== dayIndex && PROGRAM[state.week].days[Number(oldDay)]?.pending) delete state.customSessions[oldDay];
    } else {
      state.exerciseOverrides[editingExercise.exerciseId] = payload;
      if (PROGRAM[state.week].days[dayIndex]?.pending && !state.customSessions[String(dayIndex)]) {
        state.customSessions[String(dayIndex)] = { name: `Séance libre · Jour ${dayIndex + 1}`, exercises: [] };
      }
    }
  }
  saveState();
  closeExerciseEditor();
  state.day = dayIndex;
  render();
}

function removeCustomExercise(exerciseId, day = state.day) {
  const session = state.customSessions[String(day)];
  const exercise = (session?.exercises || []).find(item => item.id === exerciseId);
  if (!session || !exercise) return;
  if (!confirm(`Retirer ${exercise.name} du planning actuel ? Son historique restera conservé.`)) return;
  session.exercises = session.exercises.filter(item => item.id !== exerciseId);
  delete state.exerciseOverrides[exerciseId];
  saveState();
  render();
}

async function ensureTrainingOneArchive(options = {}) {
  if (state.historySeedVersion >= 1) return false;
  if (accountUser?.email && accountUser.email.toLocaleLowerCase('fr') !== TRAINING_ARCHIVE_OWNER_EMAIL) {
    state.historySeedVersion = 1;
    saveState({ sync: options.sync !== false });
    return false;
  }
  const history = mergeHistory(loadHistory(), { sessions: buildTrainingOneArchive(), maxHistory: [] });
  localStorage.setItem(storageKey(STORAGE_HISTORY), JSON.stringify(history));
  state.historySeedVersion = 1;
  saveState({ sync: options.sync !== false });
  if (options.sync !== false && accountUser && accountDatabase) {
    await replaceAccountHistory(history).catch(() => setSyncStatus('error'));
  }
  return true;
}

function saveHistory(history, options = {}) {
  localStorage.setItem(storageKey(STORAGE_HISTORY), JSON.stringify(history));
  if (options.sync === false) return;
  const sync = options.session ? syncAccountSession(options.session) : syncAccountHistory(history);
  Promise.resolve(sync).catch(() => setSyncStatus(navigator.onLine === false ? 'offline' : 'error'));
}

// Merge two history objects without data loss.
// - maxHistory: dedupe by date, keep the latest update
// - sessions: dedupe by (cycle,week,day,date), keep the latest/richest version
function mergeHistory(a, b) {
  a = a || { sessions: [], maxHistory: [] };
  b = b || { sessions: [], maxHistory: [] };

  const maxByDate = new Map();
  [...(a.maxHistory || []), ...(b.maxHistory || [])].forEach(m => {
    if (!m || !m.date) return;
    const existing = maxByDate.get(m.date);
    if (!existing) { maxByDate.set(m.date, m); return; }
    if ((m.updatedAt || 0) !== (existing.updatedAt || 0)) {
      if ((m.updatedAt || 0) > (existing.updatedAt || 0)) maxByDate.set(m.date, m);
      return;
    }
    // Legacy entries have no updatedAt: retain the richer/highest snapshot.
    const sNew = (m.squat||0) + (m.bench||0) + (m.deadlift||0);
    const sOld = (existing.squat||0) + (existing.bench||0) + (existing.deadlift||0);
    if (sNew >= sOld) maxByDate.set(m.date, m);
  });
  const maxHistory = Array.from(maxByDate.values())
    .sort((x, y) => (x.date || '').localeCompare(y.date || ''));

  const sessByKey = new Map();
  const keyOf = s => `${effectiveSessionProgramId(s)}|${effectiveSessionRunId(s)}|${s.cycle || 1}|${s.week}|${s.day}`;
  [...(a.sessions || []), ...(b.sessions || [])].forEach(s => {
    if (!s || s.date === undefined) return;
    const k = keyOf(s);
    const existing = sessByKey.get(k);
    if (!existing) { sessByKey.set(k, s); return; }
    if ((s.updatedAt || 0) !== (existing.updatedAt || 0)) {
      if ((s.updatedAt || 0) > (existing.updatedAt || 0)) sessByKey.set(k, s);
      return;
    }
    // Prefer version with more completed sets; tie => prefer one with exercises array
    if ((s.setsDone || 0) > (existing.setsDone || 0)) {
      sessByKey.set(k, s);
    } else if ((s.setsDone || 0) === (existing.setsDone || 0) && (s.exercises?.length || 0) > (existing.exercises?.length || 0)) {
      sessByKey.set(k, s);
    }
  });
  const sessions = Array.from(sessByKey.values())
    .sort((x, y) => (x.date || '').localeCompare(y.date || ''));

  return { sessions, maxHistory };
}

// ============================================================
// SESSION VALIDATION
// History is written ONLY when the user validates the whole session,
// never on individual set/reps/weight changes.
// ============================================================
function isSessionValidated(week, day, cycle = state.cycle, history = loadHistory()) {
  return history.sessions.some(s => sessionMatchesContext(s, week, day, cycle));
}

function isSessionLogged(week, day) {
  return isSessionValidated(week, day);
}

function removeSessionLog(week, day) {
  const history = loadHistory();
  const removed = history.sessions.filter(s => sessionMatchesContext(s, week, day));
  if (removed.length) {
    history.sessions = history.sessions.filter(s => !sessionMatchesContext(s, week, day));
    saveHistory(history, { sync: false });
    removed.forEach(deleteAccountSession);
    if (currentPage === 'history') renderHistory();
  }
}

// Called after any set/reps/weight change to keep history coherent.
// Validation is an explicit user action (auto-popup at 100% OR the
// "Valider la séance" button, which also works on partial sessions).
// We never auto-log; we only:
//  - auto-prompt the FIRST time an un-logged session reaches 100% (shortcut),
//  - keep an already-validated session in sync (partial or full),
//  - drop a validated session only if it is fully emptied (0 done).
function afterSessionChange(week, day, wasComplete) {
  if (PROGRAM[week].days[day].rest) return;
  const prog = getDayProgress(week, day);
  const logged = isSessionLogged(week, day);
  if (logged) {
    if (prog.done === 0 && prog.skipped === 0) removeSessionLog(week, day);
    else logSession(week, day);
  } else if (prog.pct === 100 && !wasComplete) {
    showValidateModal(week, day);
  }
}

let _validateTarget = null;
function getMissingRatingCount(week, day) {
  let missing = 0;
  getSessionExercises(week, day).forEach((exercise, index) => {
    if (exercise.preFatigue) return;
    const exKey = exerciseCompletionKey(exercise, index);
    const exerciseId = exercise.id || accessoryDataKey(exercise.name);
    if (getExerciseSkip(exerciseId, state.cycle, week, day)) return;
    const hasPerformedSet = getExerciseSets(exercise).some((_, setIndex) => isSetDone(week, day, exKey, setIndex));
    if (hasPerformedSet && !getExerciseRating(exerciseId, state.cycle, week, day)) missing++;
  });
  return missing;
}

function showValidateModal(week, day) {
  _validateTarget = { week, day };
  const dd = getEffectiveDayData(week, day);
  const prog = getDayProgress(week, day);
  const partial = prog.pct < 100;
  const missingRatings = getMissingRatingCount(week, day);
  const ratingWarning = missingRatings
    ? ` ${missingRatings} ressenti${missingRatings > 1 ? 's' : ''} de bloc reste${missingRatings > 1 ? 'nt' : ''} vide${missingRatings > 1 ? 's' : ''}; la validation reste possible.`
    : '';
  document.getElementById('validateModalTitle').textContent =
    partial ? 'Valider la séance (incomplète)' : 'Séance terminée';
  document.getElementById('validateModalText').textContent = partial
    ? `Enregistrer « ${dd.name} » avec ${prog.done} série${prog.done > 1 ? 's' : ''} réalisée${prog.done > 1 ? 's' : ''}${prog.skipped ? ` et ${prog.skipped} exercice${prog.skipped > 1 ? 's' : ''} ignoré${prog.skipped > 1 ? 's' : ''}` : ''} ?${ratingWarning}`
    : `Enregistrer « ${dd.name} » dans l'historique ?${ratingWarning}`;
  document.getElementById('validateModal').classList.add('show');
}
function closeValidateModal() {
  document.getElementById('validateModal').classList.remove('show');
  _validateTarget = null;
}
function confirmValidateSession() {
  if (_validateTarget) logSession(_validateTarget.week, _validateTarget.day);
  closeValidateModal();
  render();
  if (currentPage === 'history') renderHistory();
}
function devalidateSession(week, day) {
  if (!confirm('Retirer cette séance de l\'historique ?')) return;
  removeSessionLog(week, day);
  render();
}

function logSession(week, day) {
  const dayData = getEffectiveDayData(week, day);
  if (dayData.rest || dayData.pending) return;

  const prog = getDayProgress(week, day);
  if (prog.done === 0 && prog.skipped === 0) return;

  const history = loadHistory();
  const today = localDateKey();
  // Build exercise details
  const exercises = [];
  getSessionExercises(week, day).forEach((ex, ei) => {
    const exKey = exerciseCompletionKey(ex, ei);
    const exerciseId = ex.id || ACCESSORY_IDS[ex.name] || accessoryDataKey(ex.name);
    const skipReason = getExerciseSkip(exerciseId, state.cycle, week, day);
    const sets = getExerciseSets(ex);
    const details = [];
    let exDone = 0;
    const completedSetIndexes = [];
    sets.forEach((set, si) => {
      const done = isSetDone(week, day, exKey, si);
      if (done) {
        exDone++;
        completedSetIndexes.push(si);
      }
      let weight = null;
      let reps = set.r === "AMRAP" ? "AMRAP" : set.r;
      let desc = '';

      if (set.pct && ex.ref) {
        // PR exercise: use calculated weight + program reps
        desc = `${set.r === "AMRAP" ? "AMRAP" : set.r + "r"}`;
        weight = calcWeight(set.pct, ex.ref);
        if (weight !== null) desc += ` ${weight}kg`;
      } else if (!ex.ref) {
        // Accessory: use custom reps (or program default) + custom weight
        const dataKey = ex.id || ex.name;
        const customR = getCustomReps(dataKey, si);
        reps = customR !== null ? customR : reps;
        desc = `${reps === "AMRAP" ? "AMRAP" : reps + (ex.tracking === 'time' ? " sec" : "r")}`;
        weight = getCustomWeight(dataKey, si, state.cycle, week, day, getExerciseTargetWeight(ex, si));
        if (weight !== null) desc += ` ${weight}kg`;
      } else {
        desc = `${set.r === "AMRAP" ? "AMRAP" : set.r + "r"}`;
      }
      const actualRpe = !ex.ref ? getSetRpe(ex.id || ex.name, si, state.cycle, week, day) : (set.rpe ?? null);
      if (actualRpe !== null) desc += ` RPE${actualRpe}`;
      details.push({ desc, done, reps, weight, rpe: actualRpe, tracking: ex.tracking || 'reps' });
    });
    if (!ex.ref && completedSetIndexes.length) commitExerciseDraft(ex.id || ex.name, completedSetIndexes);
    exercises.push({
      id: exerciseId,
      name: ex.name,
      source: ex.isCustom ? "custom" : ex.isFreestyle ? "freestyle" : ex.isExtra ? "added" : "programmed",
      day: day + 1,
      section: ex.section || null,
      target: {
        sets: sets.length,
        reps: ex.repsLabel || ex.sets?.[0]?.r || null,
        weight: ex.targetWeight ?? null,
        weightLabel: ex.targetWeightLabel || null,
        rest: ex.rest ?? null,
        restLabel: ex.restLabel || null
      },
      rudyComment: ex.rudyComment || '',
      instructions: ex.instructions || '',
      note: getCustomNote(exerciseId),
      rating: getExerciseRating(ex.id || accessoryDataKey(ex.name), state.cycle, week, day),
      pain: getExercisePain(exerciseId, state.cycle, week, day),
      personalMedia: getPersonalMedia(exerciseId, state.cycle, week, day),
      media: ex.media || {},
      skipped: !!skipReason,
      skipReason: skipReason || null,
      sets: details,
      done: exDone,
      total: sets.length
    });
  });

  // Check if session for today+week+day already exists, update it
  const existingIdx = history.sessions.findIndex(s =>
    sessionMatchesContext(s, week, day)
  );
  const existingSession = existingIdx >= 0 ? history.sessions[existingIdx] : null;
  const sessionDate = existingIdx >= 0 ? history.sessions[existingIdx].date : today;
  const now = Date.now();

  const session = {
    sessionId: existingSession?.sessionId || createRunId(),
    schemaVersion: DATA_SCHEMA_VERSION,
    programId: PROGRAM_ID,
    runId: state.runId || INITIAL_RUN_ID,
    date: sessionDate,
    cycle: state.cycle,
    week,
    day,
    dayName: dayData.name,
    weekName: PROGRAM[week].name,
    setsTotal: prog.total,
    setsDone: prog.done,
    setsResolved: prog.resolved,
    skippedExercises: prog.skipped,
    exercises,
    startedAt: existingSession?.startedAt || now,
    validatedAt: existingSession?.validatedAt || now,
    updatedAt: now
  };

  if (existingIdx >= 0) {
    history.sessions[existingIdx] = session;
  } else {
    history.sessions.push(session);
  }

  saveState();
  saveHistory(history, { session });
}

// PAGE SWITCHING

let currentPage = 'program';

function showPage(page) {
  currentPage = page;
  if (window.scrollTo) window.scrollTo({ top: 0, behavior: 'auto' });
  document.getElementById('content').style.display = page === 'program' ? '' : 'none';
  document.getElementById('nav').style.display = page === 'program' ? '' : 'none';
  document.getElementById('historyPage').style.display = page === 'history' ? '' : 'none';
  document.getElementById('btnProgram').classList.toggle('active', page === 'program');
  document.getElementById('btnHistory').classList.toggle('active', page === 'history');
  document.getElementById('btnProgram').setAttribute('aria-pressed', String(page === 'program'));
  document.getElementById('btnHistory').setAttribute('aria-pressed', String(page === 'history'));
  document.getElementById('timerBar').style.display = page === 'program' ? '' : 'none';
  document.getElementById('resetDayBtn').style.display = page === 'program' ? '' : 'none';

  if (page === 'history') {
    renderHistory();
  }
}

// ============================================================
// HISTORY RENDERING
// ============================================================
function formatHistoryDate(dateKey) {
  const match = String(dateKey || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return match ? `${match[3]}/${match[2]}/${match[1].slice(2)}` : String(dateKey || '');
}

function formatSessionDate(session) {
  return session?.displayDate || formatHistoryDate(session?.date);
}

let historySearchQuery = '';
let historyVisibleCount = 50;
let historySearchTimer = null;

function queueHistorySearch(query) {
  clearTimeout(historySearchTimer);
  historySearchTimer = setTimeout(() => setHistorySearch(query), 120);
}

function setHistorySearch(query) {
  historySearchQuery = String(query || '').trim().toLocaleLowerCase('fr');
  historyVisibleCount = 50;
  renderHistory();
  const input = document.getElementById('historySearch');
  if (input) {
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  }
}

function showMoreHistory() {
  historyVisibleCount += 50;
  renderHistory();
}

function renderHistory() {
  const container = document.getElementById('historyPage');
  const history = loadHistory();
  const allSessions = (history.sessions || []).slice().sort((a, b) =>
    ((b.validatedAt || b.updatedAt || 0) - (a.validatedAt || a.updatedAt || 0)) || String(b.date || '').localeCompare(String(a.date || ''))
  );

  if (allSessions.length === 0) {
    container.innerHTML = `<div class="empty-history"><div class="icon">&#128202;</div><h2>Pas encore d'historique</h2><p>Les séances validées apparaîtront ici.</p></div>`;
    return;
  }

  const recentRatings = allSessions.slice(0, 12).flatMap(session =>
    (session.exercises || []).map(exercise => exercise.rating).filter(Boolean)
  );
  const ratingCounts = recentRatings.reduce((counts, rating) => {
    counts[rating] = (counts[rating] || 0) + 1;
    return counts;
  }, {});

  let html = '<div class="history-title-row"><div><span class="history-kicker">Historique / semaine précédente</span><h2>Performances conservées</h2><p>Les charges réellement utilisées restent séparées des cibles du plan actuel.</p></div></div>';
  html += `<div class="history-summary">
    <div><strong>${allSessions.length}</strong><span>Séances</span></div>
    <div><strong>${ratingCounts.easy || 0}</strong><span>Très faciles</span></div>
    <div><strong>${ratingCounts.right || 0}</strong><span>Adaptées</span></div>
    <div><strong>${ratingCounts.hard || 0}</strong><span>Très difficiles</span></div>
  </div>`;
  html += `<div class="history-toolbar"><input id="historySearch" type="search" value="${escAttr(historySearchQuery)}" placeholder="Rechercher un exercice ou une date" aria-label="Rechercher dans l'historique" oninput="queueHistorySearch(this.value)"></div>`;

  const sessions = allSessions.filter(session => {
    if (!historySearchQuery) return true;
    const haystack = [session.date, session.displayDate, session.dayName, session.weekName, ...(session.exercises || []).flatMap(exercise => [exercise.name, exercise.summary, exercise.note, exercise.pain?.location])]
      .join(' ').toLocaleLowerCase('fr');
    return haystack.includes(historySearchQuery);
  });

  if (!sessions.length) {
    html += '<div class="empty-history compact"><p>Aucune séance ne correspond à cette recherche.</p></div>';
  }

  sessions.slice(0, historyVisibleCount).forEach((session, index) => {
    const performedExercises = (session.exercises || []).filter(exercise => (exercise.done || 0) > 0 || exercise.summary).length;
    const skippedExercises = (session.exercises || []).filter(exercise => exercise.skipped).length;
    const currentProgram = effectiveSessionProgramId(session) === PROGRAM_ID;
    const sessionLabel = currentProgram
      ? `Semaine ${session.cycle || 1} · ${session.dayName || 'Séance'}`
      : `${session.archiveLabel || session.weekName || 'Archive'} · ${session.dayName || 'Séance'}`;
    const badgeText = `${performedExercises} réalisé${performedExercises > 1 ? 's' : ''}${skippedExercises ? ` · ${skippedExercises} ignoré${skippedExercises > 1 ? 's' : ''}` : ''}`;

    html += `<div class="session-log">
      <button class="session-header" aria-expanded="false" aria-controls="session-${index}" onclick="toggleSessionDetail(${index},this)">
        <span class="session-date">${escHtml(formatSessionDate(session))}</span>
        <span class="session-label">${escHtml(sessionLabel)}</span>
        <span class="session-badge ${skippedExercises ? 'partial' : 'complete'}">${escHtml(badgeText)}</span>
      </button>
      <div class="session-detail" id="session-${index}">`;

    (session.exercises || []).filter(exercise =>
      (exercise.done || 0) > 0 || exercise.skipped || exercise.rating || exercise.note || exercise.summary || exercise.difficultyText || (exercise.pain && (exercise.pain.score !== null || exercise.pain.location))
    ).forEach(exercise => {
      const formatDesc = desc => escHtml(desc).replace(/(\d+(?:\.\d+)?kg)/g, '<b style="color:var(--blue)">$1</b>');
      html += `<div class="session-exercise"><div class="session-exercise-name">${escHtml(exercise.name)}${exercise.source === 'added' ? ' · ajouté' : ''}</div>`;
      if (exercise.skipped) {
        html += `<span class="history-skip">Ignoré · ${escHtml(SKIP_LABELS[exercise.skipReason] || exercise.skipReason || 'Non précisé')}</span>`;
      } else if ((exercise.sets || []).length) {
        html += `<div class="session-sets">${(exercise.sets || []).map(set =>
          `<span class="${set.done ? 'history-set-done' : 'history-set-missed'}">${set.done ? '&#10003;' : '&#8212;'} ${formatDesc(set.desc)}</span>`
        ).join(' &nbsp; ')}</div>`;
      }
      if (exercise.target) {
        const targetParts = [exercise.target.sets && exercise.target.reps ? `${exercise.target.sets} × ${exercise.target.reps}` : '', exercise.target.weightLabel || (exercise.target.weight !== null && exercise.target.weight !== undefined ? `${exercise.target.weight} kg` : ''), exercise.target.restLabel || ''].filter(Boolean);
        if (targetParts.length) html += `<div class="history-target">Prescription de l’époque : ${escHtml(targetParts.join(' · '))}</div>`;
      }
      if (exercise.summary) html += `<div class="history-summary-text">${escHtml(exercise.summary)}</div>`;
      if (exercise.difficultyText) html += `<span class="history-effort">Difficulté : ${escHtml(exercise.difficultyText)}</span>`;
      if (exercise.rating) html += `<span class="history-effort">Ressenti : ${escHtml(RATING_LABELS[exercise.rating] || exercise.rating)}</span>`;
      if (exercise.pain && (exercise.pain.score !== null || exercise.pain.location)) {
        const painText = `${exercise.pain.score !== null ? `${exercise.pain.score}/10` : 'intensité non renseignée'}${exercise.pain.location ? ` · ${exercise.pain.location}` : ''}`;
        html += `<span class="history-pain">Douleur : ${escHtml(painText)}</span>`;
      }
      if (exercise.rudyComment) html += `<div class="history-rudy"><strong>Rudy :</strong> ${escHtml(exercise.rudyComment)}</div>`;
      if (exercise.note) html += `<div class="history-note">${escHtml(exercise.note)}</div>`;
      const historyLinks = [
        ['Photo', safeExternalUrl(exercise.media?.photo)],
        ['Vidéo', safeExternalUrl(exercise.media?.video)],
        ['Référence', safeExternalUrl(exercise.media?.reference)],
        ['Vidéo personnelle', safeExternalUrl(exercise.personalMedia?.videoUrl)],
        ['Photo personnelle', safeExternalUrl(exercise.personalMedia?.photoUrl)]
      ].filter(([, url]) => url);
      if (historyLinks.length) html += `<div class="history-media">${historyLinks.map(([label, url]) => `<a href="${escAttr(url)}" target="_blank" rel="noopener noreferrer">${label}</a>`).join('')}</div>`;
      html += '</div>';
    });
    html += '</div></div>';
  });

  if (sessions.length > historyVisibleCount) {
    html += `<button class="history-more" onclick="showMoreHistory()">Afficher 50 séances de plus (${sessions.length - historyVisibleCount} restantes)</button>`;
  }
  if ((history.maxHistory || []).length) {
    html += `<p class="history-archive-note">${history.maxHistory.length} ancienne${history.maxHistory.length > 1 ? 's' : ''} mesure${history.maxHistory.length > 1 ? 's' : ''} SBD conservée${history.maxHistory.length > 1 ? 's' : ''} dans les sauvegardes.</p>`;
  }
  container.innerHTML = html;
}

function toggleSessionDetail(idx, button) {
  const el = document.getElementById('session-' + idx);
  if (el) {
    const open = el.classList.toggle('open');
    if (button) button.setAttribute('aria-expanded', String(open));
  }
}

// ============================================================
// KEYBOARD SHORTCUTS
// ============================================================
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('accountModal').classList.contains('show')) closeAccountModal();
    else if (document.getElementById('exerciseEditorModal').classList.contains('show')) closeExerciseEditor();
    else if (document.getElementById('sessionEditorModal').classList.contains('show')) closeSessionEditor();
    else if (document.getElementById('accessoryPickerModal').classList.contains('show')) closeAccessoryPicker();
    else if (document.getElementById('validateModal').classList.contains('show')) closeValidateModal();
    else if (document.getElementById('settingsModal').classList.contains('show')) closeSettings();
    return;
  }
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
  if (e.key === ' ' || e.key === 'Spacebar') {
    e.preventDefault();
    toggleTimer();
  }
  if (e.key === 'r' || e.key === 'R') resetTimer();
  if (e.key === 'ArrowRight') {
    if (state.day < 6) selectDay(state.day + 1);
  }
  if (e.key === 'ArrowLeft') {
    if (state.day > 0) selectDay(state.day - 1);
  }
});

  if (e.target.classList.contains('modal-overlay')) closeSettings();

document.getElementById('validateModal').addEventListener('click', (e) => {

let waitingServiceWorker = null;
function showAppUpdate(worker) {
  waitingServiceWorker = worker;
  document.getElementById('updateBanner').classList.add('show');
}
function activateAppUpdate() {
  if (waitingServiceWorker) waitingServiceWorker.postMessage({ type: 'SKIP_WAITING' });
  else location.reload();
}

// PWA Service Worker
if ('serviceWorker' in navigator) {
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshing) return;
    refreshing = true;
    location.reload();
  });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(registration => {
    if (registration.waiting) showAppUpdate(registration.waiting);
    registration.update().catch(() => {});
    registration.addEventListener('updatefound', () => {
      const worker = registration.installing;
      if (!worker) return;
      worker.addEventListener('statechange', () => {
        if (worker.state === 'installed' && navigator.serviceWorker.controller) showAppUpdate(worker);
      });
    });
  }).catch(() => {});
}
